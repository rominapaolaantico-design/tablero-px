function keywordClassifyTipo(texto) {
  const t = (texto||'').toLowerCase()
  if (/perd|extrav|llaves|monedero|\bdni\b/.test(t)) return 'Extravío de objetos personales'
  if (/malos? trat|mal trato|maltrat|destrato|negligencia|no atendieron|no la atendieron|no lo atendieron|mala atenci/.test(t)) return 'Trato / maltrato al paciente'
  if (/receta|\bomes?\b|orden médic|orden medic|pedido médic|pedido medic|prescrip/.test(t)) return 'Problemas asistenciales (orden médica)'
  if (/historia clin|hc urgente|derivaci|envio de historia|internad/.test(t)) return 'Historia clínica / internación / derivación'
  if (/turno|reprogramaci|agenda/.test(t)) return 'Turnos y agenda'
  if (/whatsapp|whatsasp|sin respuesta/.test(t)) return 'Falta de respuesta (WhatsApp/canal digital)'
  if (/recepci/.test(t)) return 'Demora en recepción'
  if (/informe/.test(t)) return 'Demora en entrega de informes'
  if (/apross|autoriza|validacion|liberacion/.test(t)) return 'Demora en autorización'
  if (/cambio de nombre|sistema/.test(t)) return 'Problema de sistema / carga de datos'
  if (/^[\w.-]+@[\w.-]+\s*$/.test(t.trim())) return 'Sin descripción suficiente para clasificar'
  return 'Otros / a revisar'
}
function deriveTipoReclamo(row) {
  for (const col in TIPO_CLEAN_MAP) {
    if (row[col] !== undefined && row[col] !== null && String(row[col]).trim() !== '') {
      return { tipo: TIPO_CLEAN_MAP[col], detalle: String(row[col]).trim() }
    }
  }
  for (const col of TIPO_GENERIC_COLS) {
    if (row[col] !== undefined && row[col] !== null && String(row[col]).trim() !== '') {
      return { tipo: keywordClassifyTipo((row['Resumen']||'') + ' ' + (row['Descripción']||'')), detalle: null }
    }
  }
  return { tipo: null, detalle: null }
}

function processJiraCSV(text, fileName) {
  let parsed
  try {
    parsed = Papa.parse(text, { header:true, skipEmptyLines:true })
  } catch (e) {
    alert('No pude leer el archivo. ¿Es un CSV exportado de Jira?')
    return
  }
  const rows = parsed.data
  if (!rows.length || !('Clave de incidencia' in rows[0])) {
    alert('El archivo no parece ser un export de Jira (falta la columna "Clave de incidencia"). Probá con el CSV original, sin editar.')
    return
  }
  let nExcluidos = 0
  const records = []
  let fechaMin = null, fechaMax = null, nResueltaNula = 0
  rows.forEach(row => {
    const resumen = row['Resumen'] || ''
    if (/prueba|test/i.test(resumen)) { nExcluidos++; return }
    const creadaDt = parseJiraDateStr(row['Creada'])
    const resueltaDt = parseJiraDateStr(row['Resuelta'])
    const actualizadaDt = parseJiraDateStr(row['Actualizada'])
    if (!creadaDt) return  // sin fecha de creación no lo podemos ubicar en el tiempo
    const cISO = toISODate(creadaDt)
    const rISO = resueltaDt ? toISODate(resueltaDt) : null
    const uISO = actualizadaDt ? toISODate(actualizadaDt) : null
    if (!rISO) nResueltaNula++
    if (!fechaMin || cISO < fechaMin) fechaMin = cISO
    if (!fechaMax || cISO > fechaMax) fechaMax = cISO
    const sedeRaw = (row['Campo personalizado (Sede)']||'').trim()
    const sede = SEDE_MAP_JIRA[sedeRaw] || 'Sin sede asignada'
    const estadoRaw = (row['Estado']||'').trim()
    const estado = ESTADO_MAP_JIRA[estadoRaw] || 'Otro'
    const tipoInfo = deriveTipoReclamo(row)
    const tipo = tipoInfo.tipo || 'Sin tipo cargado'
    const detalle = tipoInfo.detalle
    const area = (row['Persona asignada']||'').trim() || 'Sin asignar'
    records.push({
      k: row['Clave de incidencia'],
      c: cISO, r: rISO, u: uISO,
      sede, canal: row['Campo personalizado (Canal de ingreso)'] || 'Sin especificar',
      prioridad: (row['Prioridad']||'').trim() || 'Sin prioridad',
      estado, tipo, detalle, area,
      recurrencia: row['Campo personalizado (¿Es recurrencia?)'] || '',
      contacto: row['Campo personalizado (Requiere contacto con paciente)'] || '',
    })
  })
  if (!records.length) {
    alert('No encontré tickets válidos en el archivo (¿todos eran de prueba, o falta la columna "Creada"?).')
    return
  }
  reclamosLiveData = {
    records,
    meta: { n_total: records.length, n_excluidos_prueba: nExcluidos, fecha_min: fechaMin, fecha_max: fechaMax, n_resuelta_nula: nResueltaNula },
    fileName,
  }
  reclamosState = { periodo:'todo', sede:'todas', prioridad:'todas' }
  idbSet('reclamos', reclamosLiveData)
  render()
}

function handleReclamosFile(file) {
  if (!file) return
  const reader = new FileReader()
  reader.onload = e => processJiraCSV(e.target.result, file.name)
  reader.onerror = () => alert('No pude leer el archivo.')
  reader.readAsText(file, 'UTF-8')
}

        <div class="kpi-sub">Resuelto + Cerrado sobre el total</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Abiertos actualmente</div>
        <div class="kpi-val warn">${abiertos.toLocaleString()}</div>
        <div class="kpi-sub">incluye pendientes de contacto/respuesta</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Recurrencias marcadas</div>
        <div class="kpi-val">${recurrencias.toLocaleString()}</div>
        <div class="kpi-sub">dato parcial — campo cargado en pocos tickets</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Cumplimiento SLA de cierre (≤7 días hábiles)</div>
        <div class="kpi-val ${pctSlaCierre===null?'':pctSlaCierre>=80?'ok':pctSlaCierre>=50?'warn':'danger'}">${fmtPct(pctSlaCierre)}</div>
        <div class="kpi-sub">Instructivo v2.0, punto 6.8 · sobre ${slaBase} casos — el campo "Resuelta" de Jira no se está completando (0% cargado), así que se usa "Actualizada" como aproximación de cierre. ${slaCounts.sin_dato} sin ninguna de las dos fechas.</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Abiertos ya vencidos (&gt;7 días hábiles)</div>
        <div class="kpi-val ${slaCounts.vencido_abierto>0?'danger':'ok'}">${slaCounts.vencido_abierto.toLocaleString()}</div>
        <div class="kpi-sub">de ${(slaCounts.vencido_abierto+slaCounts.en_plazo_abierto).toLocaleString()} abiertos con plazo aplicable · el SLA de primera respuesta por prioridad (24h/48h/72h/5 días hábiles) no se puede medir aún — Jira no tiene una fecha de primera respuesta confiable cargada</div>
      </div>
    </div>

    <div class="chart-card" style="margin-bottom:1.25rem">
      <div class="chart-title">Evolución semanal del volumen de reclamos</div>
      <div class="chart-wrap tall"><canvas id="chart-reclamos-evol"></canvas></div>
    </div>

    <div class="charts-grid">
      <div class="chart-card"><div class="chart-title">Distribución por Sede</div><div class="chart-wrap"><canvas id="chart-reclamos-sede"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">Distribución por Canal de ingreso</div><div class="chart-wrap"><canvas id="chart-reclamos-canal"></canvas></div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><div class="chart-title">Distribución por Prioridad</div><div class="chart-wrap"><canvas id="chart-reclamos-prioridad"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">Distribución por Estado</div><div class="chart-wrap"><canvas id="chart-reclamos-estado"></canvas></div></div>
    </div>

    <div class="section-label">Reclamos por área (equipo asignado)</div>
    <div class="table-card" style="padding:1rem 1.25rem">
      ${renderAreaReclamoRanking(recs)}
    </div>

    <div class="section-label">Top 10 tipos de reclamo (% abiertos / resueltos)</div>
    <div class="table-card" style="padding:1rem 1.25rem">
      ${renderTipoReclamoRanking(recs)}
    </div>

    <div class="section-label">Comparación por Sede</div>
    <div class="table-card"><table class="data-table">
      <thead><tr><th>Sede</th><th>Reclamos</th><th>% resuelto</th><th>Abiertos</th></tr></thead>
      <tbody>${renderReclamosSedeRows(recs)}</tbody>
    </table></div>

    ${renderReclamosPor1000()}

    <div class="gap-box">
      <div class="gap-box-title">⚠ Tiempos de primera respuesta / resolución — dato no confiable todavía</div>
      <div class="gap-box-text">El CSV trae "Tiempo hasta primera respuesta" y "Tiempo hasta resolución", pero los valores se repiten idénticos en tickets sin relación entre sí y aparecen negativos (ej. "-20:20"), lo que sugiere que son metas/remanente de SLA de Jira, no el tiempo real transcurrido por ticket. No los usé para evitar mostrar un promedio engañoso al Directorio.
      Además, el campo "Resuelta" está vacío en ${R.meta.n_resuelta_nula} de ${R.meta.n_total} tickets (incluso varios marcados como Resuelto/Cerrado), así que tampoco pude calcular un tiempo de resolución real a partir de esa fecha.</div>
    </div>
    ${sinSede ? `<div class="gap-box"><div class="gap-box-title">⚠ Sede sin asignar</div><div class="gap-box-text">${sinSede} de ${n} reclamos en este filtro no tienen sede cargada en JIRA.</div></div>` : ''}
    <div class="gap-box">
      <div class="gap-box-title">⚠ Clasificación de tipo de reclamo — cómo se arma</div>
      <div class="gap-box-text">La mayoría de los tipos salen de un campo específico de Jira (confiable). Para los tickets de Sanatorio CBA que sólo tienen cargado el campo genérico
      "Area preparación previa errónea" (que no refleja el tipo real), reclasifico automáticamente leyendo el Resumen y la Descripción del ticket por palabras clave.
      Esta parte es una aproximación de texto libre, no un dato estructurado — puede haber matices que se escapen.</div>
    </div>
  `

  document.getElementById('main-content').innerHTML = html
  setTimeout(()=>{
    renderReclamosEvolChart(recs)
    renderReclamosDistCharts(recs)
  }, 50)
}

function renderAreaReclamoRanking(recs) {
  const counts = {}
  const estadoPorArea = {}
  const tipoPorArea = {}
  recs.forEach(r=>{
    counts[r.area] = (counts[r.area]||0)+1
    if (!estadoPorArea[r.area]) estadoPorArea[r.area] = {abierto:0, resuelto:0, otro:0}
    if (ESTADOS_ABIERTOS.includes(r.estado)) estadoPorArea[r.area].abierto++
    else if (ESTADOS_RESUELTOS.includes(r.estado)) estadoPorArea[r.area].resuelto++
    else estadoPorArea[r.area].otro++
    if (!tipoPorArea[r.area]) tipoPorArea[r.area] = {}
    tipoPorArea[r.area][r.tipo] = (tipoPorArea[r.area][r.tipo]||0)+1
  })
  const total = recs.length
  const list = Object.entries(counts).sort((a,b)=>b[1]-a[1])
  if (!list.length) return '<div class="empty">Sin datos para este filtro.</div>'
  const maxVal = list[0][1]
  return '<div class="rank-list">' + list.map(([area,cnt])=>{
    const pct = Math.max(6, Math.round((cnt/maxVal)*100))
    const pctTotal = total ? Math.round(cnt/total*100) : 0
    const est = estadoPorArea[area] || {abierto:0,resuelto:0,otro:0}
    const pctAbierto = cnt ? Math.round(est.abierto/cnt*100) : 0
    const pctResuelto = cnt ? Math.round(est.resuelto/cnt*100) : 0
    const pctOtro = cnt ? Math.round(est.otro/cnt*100) : 0
    const abierto = reclamosUI.areaAbierto === area
    let sub = ''
    if (abierto) {
      const tipos = Object.entries(tipoPorArea[area]||{}).sort((a,b)=>b[1]-a[1])
      sub = `<div style="padding:6px 0 4px 20px;font-size:12px;color:var(--gray-dark)">${tipos.map(([t,c])=>`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>↳ ${t}</span><span style="color:var(--gray)">${c}</span></div>`).join('')}</div>`
    }
    return `<div class="rank-row" style="cursor:pointer" onclick="toggleAreaAbierto('${area.replace(/'/g,"\\'")}')">
      <div class="rank-name">${area} <span style="color:var(--gray);font-size:11px">▾</span><div style="font-size:10px;color:var(--gray);font-weight:400">${pctTotal}% del total · ${pctAbierto}% abiertos · ${pctResuelto}% resueltos${pctOtro?` · ${pctOtro}% otro`:''}</div></div>
      <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:${pct}%;background:var(--teal)"></div></div>
      <div class="rank-val">${cnt}</div>
    </div>${sub}`
  }).join('') + '</div>'
}

function renderTipoReclamoRanking(recs) {
  const counts = {}
  const detallesPorTipo = {}
  const estadoPorTipo = {}
  recs.forEach(r=>{
    counts[r.tipo] = (counts[r.tipo]||0)+1
    if (!estadoPorTipo[r.tipo]) estadoPorTipo[r.tipo] = {abierto:0, resuelto:0, otro:0}
    if (ESTADOS_ABIERTOS.includes(r.estado)) estadoPorTipo[r.tipo].abierto++
    else if (ESTADOS_RESUELTOS.includes(r.estado)) estadoPorTipo[r.tipo].resuelto++
    else estadoPorTipo[r.tipo].otro++
    if (r.detalle) {
      if (!detallesPorTipo[r.tipo]) detallesPorTipo[r.tipo] = {}
      detallesPorTipo[r.tipo][r.detalle] = (detallesPorTipo[r.tipo][r.detalle]||0)+1
    }
  })
  const list = Object.entries(counts).filter(([k])=>k!=='Sin tipo cargado').sort((a,b)=>b[1]-a[1]).slice(0,10)
  const sinTipo = counts['Sin tipo cargado'] || 0
  if (!list.length) return '<div class="empty">Sin datos para este filtro.</div>'
  const maxVal = list[0][1]
  let html = '<div class="rank-list">' + list.map(([tipo,cnt])=>{
    const pct = Math.max(6, Math.round((cnt/maxVal)*100))
    const tieneDetalle = detallesPorTipo[tipo] && Object.keys(detallesPorTipo[tipo]).length >= 2
    const abierto = reclamosUI.tipoAbierto === tipo
    const est = estadoPorTipo[tipo] || {abierto:0,resuelto:0,otro:0}
    const pctAbierto = cnt ? Math.round(est.abierto/cnt*100) : 0
    const pctResuelto = cnt ? Math.round(est.resuelto/cnt*100) : 0
    const pctOtro = cnt ? Math.round(est.otro/cnt*100) : 0
    let sub = ''
    if (abierto && tieneDetalle) {
      const detEntries = Object.entries(detallesPorTipo[tipo]).sort((a,b)=>b[1]-a[1])
      sub = `<div style="padding:6px 0 4px 20px;font-size:12px;color:var(--gray-dark)">${detEntries.map(([d,c])=>`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>↳ ${d}</span><span style="color:var(--gray)">${c}</span></div>`).join('')}</div>`
    } else if (abierto) {
      sub = `<div style="padding:6px 0 4px 20px;font-size:12px;color:var(--gray)">No hay un desglose más fino disponible para este tipo (salió de lectura de texto libre, no de un campo de Jira).</div>`
    }
    return `<div class="rank-row" style="cursor:pointer" onclick="toggleTipoAbierto('${tipo.replace(/'/g,"\\'")}')">
      <div class="rank-name">${tipo}${tieneDetalle ? ' <span style="color:var(--gray);font-size:11px">▾</span>' : ''}<div style="font-size:10px;color:var(--gray);font-weight:400">${pctAbierto}% abiertos · ${pctResuelto}% resueltos${pctOtro?` · ${pctOtro}% otro`:''}</div></div>
      <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:${pct}%;background:var(--teal)"></div></div>
      <div class="rank-val">${cnt}</div>
    </div>${sub}`
  }).join('') + '</div>'
  if (sinTipo) html += `<div style="font-size:12px;color:var(--gray);margin-top:10px">+ ${sinTipo} reclamos sin tipo cargado en Jira</div>`
  return html
}

function renderReclamosPor1000() {
  const ROLLOUT_RECLAMOS_SEDES = ['Sanatorio C+ CBA','Policlínica C+ Cerro','Policlínica C+ Pucará','Sanatorio C+ Villa María','Sanatorio C+ Río Tercero']
  if (!demorasLiveData) {
    return `<div class="gap-box">
      <div class="gap-box-title">⚠ Reclamos por 1000 atenciones — falta el Excel de Atenciones</div>
      <div class="gap-box-text">Subí un archivo real de Consulta Atenciones en la pestaña Demoras para habilitar este indicador (el de muestra no alcanza para esto).</div>
    </div>`
  }
  const Dm = demorasLiveData
  const fMin = Dm.meta.fecha_min, fMax = Dm.meta.fecha_max
  const atencionesPorCentro = {}
  Dm.rows.forEach(r=>{
    const centro = Dm.centros[r[1]]
    atencionesPorCentro[centro] = (atencionesPorCentro[centro]||0) + r[3]
  })
  const atencionesPorSedeLabel = {}
  Object.entries(atencionesPorCentro).forEach(([centro,n])=>{ atencionesPorSedeLabel[centroLabelD(centro)] = n })

  const R = reclamosActiveData()
  const reclamosEnRango = R.records.filter(r=> r.c && r.c >= fMin && r.c <= fMax)
  const reclamosPorSede = {}
  reclamosEnRango.forEach(r=>{ reclamosPorSede[r.sede] = (reclamosPorSede[r.sede]||0)+1 })

  const sedes = Array.from(new Set([...Object.keys(atencionesPorSedeLabel), ...Object.keys(reclamosPorSede)]))
    .filter(s => atencionesPorSedeLabel[s]) // solo sedes con atenciones medidas
    .filter(s => ROLLOUT_RECLAMOS_SEDES.includes(s)) // solo sedes con el sistema de reclamos activo (o incorporándose)
    .sort((a,b)=>(atencionesPorSedeLabel[b]||0)-(atencionesPorSedeLabel[a]||0))

  const OBJETIVO = 2.0, ATENCION = 4.0
  const ratioClass = v => v===null ? '' : v<=OBJETIVO ? 'ok' : v<=ATENCION ? 'warn' : 'danger'
  const ratioColor = v => v===null ? 'var(--gray)' : v<=OBJETIVO ? 'var(--teal)' : v<=ATENCION ? 'var(--warning)' : 'var(--danger)'

  const totalReclamos = sedes.reduce((a,s)=>a+(reclamosPorSede[s]||0),0)
  const totalAtenciones = sedes.reduce((a,s)=>a+(atencionesPorSedeLabel[s]||0),0)
  const ratioRed = totalAtenciones ? (totalReclamos/totalAtenciones*1000) : null

  const maxEscala = Math.max(ATENCION*1.5, ...sedes.map(s=> atencionesPorSedeLabel[s] ? (reclamosPorSede[s]||0)/atencionesPorSedeLabel[s]*1000 : 0))
  const markerPct = Math.min(96, (OBJETIVO/maxEscala*100))

  const barrasHtml = sedes.map(s=>{
    const atenciones = atencionesPorSedeLabel[s]||0
    const reclamos = reclamosPorSede[s]||0
    const ratio = atenciones ? (reclamos/atenciones*1000) : null
    const pct = ratio===null ? 0 : Math.max(4, Math.min(100, (ratio/maxEscala)*100))
    return `<div class="rank-row">
      <div class="rank-name">${s}</div>
      <div class="rank-bar-wrap" style="position:relative">
        <div class="rank-bar-fill" style="width:${pct}%;background:${ratioColor(ratio)}"></div>
        <div style="position:absolute;left:${markerPct}%;top:-3px;bottom:-3px;width:2px;background:var(--gray-dark);opacity:.5" title="Objetivo: ${OBJETIVO}"></div>
      </div>
      <div class="rank-val" style="color:${ratioColor(ratio)}">${ratio===null?'—':ratio.toFixed(2)}</div>
    </div>`
  }).join('')

  return `
    <div class="section-label">Reclamos cada 1000 atenciones ★</div>
    <div class="kpi-grid" style="margin-bottom:1rem">
      <div class="kpi-card" style="border-width:2px;border-color:${ratioColor(ratioRed)}">
        <div class="kpi-label">Red — Reclamos / 1000 atenciones</div>
        <div class="kpi-val ${ratioClass(ratioRed)}" style="font-size:40px">${ratioRed===null?'—':ratioRed.toFixed(2)}</div>
        <div class="kpi-sub">Objetivo: ≤ ${OBJETIVO.toFixed(1)} · Atención: ${OBJETIVO.toFixed(1)}-${ATENCION.toFixed(1)} · Alerta: &gt;${ATENCION.toFixed(1)}</div>
      </div>
    </div>
    <div class="table-card" style="padding:1rem 1.25rem">
      <div style="display:flex;justify-content:flex-end;gap:14px;font-size:11px;color:var(--gray);margin-bottom:8px">
        <span>▬ <span style="color:var(--teal)">●</span> Objetivo (≤${OBJETIVO})</span>
        <span><span style="color:var(--warning)">●</span> Atención</span>
        <span><span style="color:var(--danger)">●</span> Alerta</span>
        <span>┃ línea = objetivo</span>
      </div>
      ${barrasHtml || '<div class="empty">Sin datos.</div>'}
    </div>
    <div class="info-box">
      <div class="info-box-title">ℹ Cómo se calcula</div>
      <div class="info-box-text">Se usa <b>atenciones</b> (no pacientes únicos) como base — cada visita es una "exposición" real a tener o no una mala experiencia, y un mismo paciente puede reclamar por una de varias visitas.
      Reclamos y atenciones se recortan al mismo rango de fechas: ${fmtFecha(fMin)} — ${fmtFecha(fMax)} (el período cubierto por el archivo de Atenciones cargado). Solo se muestran las sedes donde el sistema de reclamos ya está activo o incorporándose (por eso no aparecen Sarmiento, Capilla del Monte, etc. — ahí un "0" no significaría nada, ya que ni siquiera están cargando reclamos todavía).</div>
    </div>`
}

function renderReclamosSedeRows(recs) {
  const groups = {}
  recs.forEach(r=>{
    if (!groups[r.sede]) groups[r.sede] = {n:0, resuelto:0, abierto:0}
    groups[r.sede].n++
    if (ESTADOS_RESUELTOS.includes(r.estado)) groups[r.sede].resuelto++
    if (ESTADOS_ABIERTOS.includes(r.estado)) groups[r.sede].abierto++
  })
  const entries = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n)
  if (!entries.length) return '<tr><td colspan="4" class="empty">Sin datos para este filtro.</td></tr>'
  return entries.map(([sede,g])=>`<tr>
    <td><div class="sede-name">${sede}</div></td>
    <td style="color:var(--gray)">${g.n}</td>
    <td>${fmtPct(g.n?g.resuelto/g.n*100:null)}</td>
    <td>${g.abierto}</td>
  </tr>`).join('')
}

function renderReclamosEvolChart(recs) {
  const byWeek = {}
  recs.forEach(r=>{
    const d = parseLocalDate(r.c)
    const day = d.getDay()
    const diffToMonday = (day===0? -6 : 1-day)
    const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday)
    const key = monday.toISOString().slice(0,10)
    byWeek[key] = (byWeek[key]||0)+1
  })
  const labels = Object.keys(byWeek).sort()
  const data = labels.map(l=>byWeek[l])
  const labelsFmt = labels.map(l=>fmtFecha(l))
  if (charts.reclamosEvol) charts.reclamosEvol.destroy()
  const ctx = document.getElementById('chart-reclamos-evol')
  if (!ctx) return
  charts.reclamosEvol = new Chart(ctx,{type:'line',data:{labels:labelsFmt,datasets:[{label:'Reclamos',data,borderColor:'#2BA98B',backgroundColor:'rgba(43,169,139,0.1)',borderWidth:2.5,tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#F0F0F0'},ticks:{font:{family:'Nunito'}}},x:{grid:{display:false},ticks:{font:{family:'Nunito'},maxTicksLimit:15}}}}})
}

function renderReclamosDistCharts(recs) {
  function countBy(field) {
    const c = {}
    recs.forEach(r=>{ const k = r[field]||'Sin especificar'; c[k]=(c[k]||0)+1 })
    return c
  }
  const sedeCounts = countBy('sede')
  const sedeEntries = Object.entries(sedeCounts).sort((a,b)=>b[1]-a[1])
  if (charts.reclamosSede) charts.reclamosSede.destroy()
  const ctxS = document.getElementById('chart-reclamos-sede')
  if (ctxS) charts.reclamosSede = new Chart(ctxS,{type:'bar',data:{labels:sedeEntries.map(e=>e[0]),datasets:[{data:sedeEntries.map(e=>e[1]),backgroundColor:'#2BA98B',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:'#F0F0F0'},ticks:{font:{family:'Nunito'}}},y:{grid:{display:false},ticks:{font:{family:'Nunito',size:10}}}}}})

  const canalCounts = countBy('canal')
  const canalEntries = Object.entries(canalCounts).sort((a,b)=>b[1]-a[1])
  if (charts.reclamosCanal) charts.reclamosCanal.destroy()
  const ctxC = document.getElementById('chart-reclamos-canal')
  if (ctxC) charts.reclamosCanal = new Chart(ctxC,{type:'bar',data:{labels:canalEntries.map(e=>e[0]),datasets:[{data:canalEntries.map(e=>e[1]),backgroundColor:'#5DCAA5',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#F0F0F0'},ticks:{font:{family:'Nunito'}}},x:{grid:{display:false},ticks:{font:{family:'Nunito'},maxRotation:20}}}}})

  const prioOrder = ['Crítico','Alto','Medio','Bajo','Sin prioridad']
  const prioCounts = countBy('prioridad')
  const prioLabels = prioOrder.filter(p=>prioCounts[p])
  if (charts.reclamosPrioridad) charts.reclamosPrioridad.destroy()
  const ctxP = document.getElementById('chart-reclamos-prioridad')
  if (ctxP) charts.reclamosPrioridad = new Chart(ctxP,{type:'bar',data:{labels:prioLabels,datasets:[{data:prioLabels.map(p=>prioCounts[p]),backgroundColor:prioLabels.map(p=>PRIORIDAD_COLOR[p]),borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#F0F0F0'},ticks:{font:{family:'Nunito'}}},x:{grid:{display:false},ticks:{font:{family:'Nunito'}}}}}})

  const estadoOrder = ['Abierto','En análisis','Pendiente contacto paciente','Pendiente respuesta interna','Resuelto','Cerrado','Cancelado','Otro']
  const estadoCounts = countBy('estado')
  const estadoLabels = estadoOrder.filter(e=>estadoCounts[e])
  const estadoColors = estadoLabels.map(e=> ESTADOS_RESUELTOS.includes(e)?'#2BA98B' : e==='Cancelado'||e==='Otro' ? '#9B9B9B' : '#EF9F27')
  if (charts.reclamosEstado) charts.reclamosEstado.destroy()
  const ctxE = document.getElementById('chart-reclamos-estado')
  if (ctxE) charts.reclamosEstado = new Chart(ctxE,{type:'bar',data:{labels:estadoLabels,datasets:[{data:estadoLabels.map(e=>estadoCounts[e]),backgroundColor:estadoColors,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:'#F0F0F0'},ticks:{font:{family:'Nunito'}}},y:{grid:{display:false},ticks:{font:{family:'Nunito',size:10}}}}}})
}
</script>
