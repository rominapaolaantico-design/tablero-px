<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero PX — Red de la Cañada</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --teal: #2BA98B; --teal-dark: #1E8A70; --teal-light: #E8F7F3; --teal-mid: #5DCAA5;
  --gray: #9B9B9B; --gray-dark: #2D2D2D; --gray-light: #F7FAF9; --gray-border: #E2EDEA;
  --white: #fff; --danger: #E24B4A; --danger-light: #FDEAEA; --warning: #EF9F27; --warning-light: #FEF3E2;
  --font: 'Nunito', sans-serif; --radius: 14px; --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(43,169,139,0.08); --shadow-md: 0 4px 24px rgba(43,169,139,0.13);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--gray-light); color: var(--gray-dark); min-height: 100vh; }

/* LOGIN */
#login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--teal),var(--teal-dark)); }
.login-card { background:var(--white); border-radius:var(--radius); padding:2.5rem 2rem; width:100%; max-width:380px; box-shadow:var(--shadow-md); text-align:center; }
.login-logo { width:180px; margin-bottom:1.5rem; }
.login-title { font-size:18px; font-weight:700; margin-bottom:4px; }
.login-sub { font-size:13px; color:var(--gray); margin-bottom:1.5rem; }
.login-input { width:100%; padding:12px 14px; border:1.5px solid var(--gray-border); border-radius:var(--radius-sm); font-family:var(--font); font-size:14px; margin-bottom:12px; outline:none; transition:border .2s; }
.login-input:focus { border-color:var(--teal); }
.login-btn { width:100%; padding:13px; background:var(--teal); color:var(--white); border:none; border-radius:var(--radius-sm); font-family:var(--font); font-size:15px; font-weight:600; cursor:pointer; }
.login-btn:hover { background:var(--teal-dark); }
.login-error { color:var(--danger); font-size:12px; margin-top:8px; display:none; }

/* DASHBOARD */
#dashboard { display:none; }

/* HEADER */
.header { background:var(--white); border-bottom:1px solid var(--gray-border); padding:0 2rem; height:60px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:var(--shadow); }
.header-left { display:flex; align-items:center; gap:14px; }
.header-logo { height:32px; }
.header-title { font-size:15px; font-weight:700; }
.header-right { display:flex; align-items:center; gap:10px; }
.header-tag { font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; background:var(--teal-light); color:var(--teal-dark); }
.logout-btn { font-size:12px; color:var(--gray); background:none; border:none; cursor:pointer; font-family:var(--font); padding:4px 8px; border-radius:var(--radius-sm); }
.logout-btn:hover { background:var(--gray-light); }

/* HERO BANNER */
.hero-banner { width:100%; line-height:0; }
.hero-banner img { width:100%; height:auto; max-height:110px; object-fit:cover; display:block; }

/* TABS */
.tabs { background:var(--white); border-bottom:1px solid var(--gray-border); padding:0 2rem; display:flex; gap:0; }
.tab-btn { font-family:var(--font); font-size:14px; font-weight:600; padding:14px 20px; border:none; background:none; cursor:pointer; color:var(--gray); border-bottom:3px solid transparent; transition:all .2s; }
.tab-btn.active { color:var(--teal); border-bottom-color:var(--teal); }

/* TOOLBAR */
.toolbar { background:var(--white); border-bottom:1px solid var(--gray-border); padding:10px 2rem; display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
.toolbar-left { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.filter-label { font-size:12px; font-weight:600; color:var(--gray); }
.filter-btn { font-size:12px; font-weight:600; padding:6px 14px; border-radius:20px; border:1.5px solid var(--gray-border); background:var(--white); color:var(--gray); cursor:pointer; font-family:var(--font); transition:all .15s; }
.filter-btn.active { background:var(--teal); border-color:var(--teal); color:var(--white); }
.filter-btn:hover:not(.active) { border-color:var(--teal); color:var(--teal); }
.search-box { padding:7px 12px; border:1.5px solid var(--gray-border); border-radius:var(--radius-sm); font-family:var(--font); font-size:13px; outline:none; width:220px; transition:border .2s; }
.search-box:focus { border-color:var(--teal); }

/* MAIN */
.main { padding:1.5rem 2rem; max-width:1300px; margin:0 auto; }

/* BACK BTN */
.back-btn { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--teal); background:none; border:none; cursor:pointer; font-family:var(--font); padding:6px 0; margin-bottom:1rem; }
.back-btn:hover { color:var(--teal-dark); }

/* ALERTS */
.alerts-box { background:var(--danger-light); border:1px solid #F5BFBF; border-radius:var(--radius); padding:1rem 1.25rem; margin-bottom:1.25rem; }
.alerts-title { font-size:12px; font-weight:700; color:var(--danger); letter-spacing:.04em; text-transform:uppercase; margin-bottom:10px; }
.alert-row { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid #F5BFBF; cursor:pointer; }
.alert-row:last-child { border-bottom:none; padding-bottom:0; }
.alert-row:hover { opacity:.8; }
.alert-dot { width:7px; height:7px; border-radius:50%; background:var(--danger); flex-shrink:0; margin-top:5px; }
.alert-text { font-size:13px; line-height:1.5; }
.alert-meta { font-size:11px; color:var(--gray); margin-top:2px; }

/* KPIs */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:1.25rem; }
.kpi-card { background:var(--white); border-radius:var(--radius); padding:1.25rem 1.5rem; box-shadow:var(--shadow); border:1px solid var(--gray-border); }
.kpi-label { font-size:11px; font-weight:600; color:var(--gray); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
.kpi-val { font-size:32px; font-weight:700; line-height:1; margin-bottom:4px; }
.kpi-val.ok { color:var(--teal); }
.kpi-val.warn { color:var(--warning); }
.kpi-val.danger { color:var(--danger); }
.kpi-sub { font-size:11px; color:var(--gray); }
.kpi-trend { font-size:11px; margin-top:4px; font-weight:600; }
.kpi-trend.up { color:var(--teal); }
.kpi-trend.down { color:var(--danger); }

.section-label { font-size:11px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.05em; margin:1.5rem 0 10px; }

/* TABLE */
.table-card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--gray-border); overflow:hidden; margin-bottom:1.25rem; }
.data-table { width:100%; border-collapse:collapse; font-size:13px; }
.data-table th { text-align:left; font-weight:700; font-size:11px; color:var(--gray); padding:12px 16px; border-bottom:1px solid var(--gray-border); text-transform:uppercase; letter-spacing:.04em; background:var(--gray-light); cursor:pointer; user-select:none; }
.data-table th:hover { color:var(--teal); }
.data-table td { padding:12px 16px; border-bottom:1px solid var(--gray-border); color:var(--gray-dark); }
.data-table tr:last-child td { border-bottom:none; }
.data-table tbody tr { cursor:pointer; transition:background .15s; }
.data-table tbody tr:hover td { background:var(--teal-light); }
.sede-name { font-weight:600; }
.click-hint { font-size:10px; color:var(--teal); margin-top:2px; }

.score-wrap { display:flex; align-items:center; gap:8px; }
.score-num { font-weight:700; min-width:28px; }
.score-bar { flex:1; height:6px; background:var(--gray-border); border-radius:3px; min-width:50px; }
.score-fill { height:6px; border-radius:3px; transition:width .4s; }

.badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
.badge-ok { background:var(--teal-light); color:var(--teal-dark); }
.badge-warn { background:var(--warning-light); color:#7A4F06; }
.badge-danger { background:var(--danger-light); color:#8B1A1A; }

/* CHARTS GRID */
.charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:1.25rem; }
.chart-card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--gray-border); padding:1.25rem 1.5rem; }
.chart-title { font-size:13px; font-weight:700; margin-bottom:1rem; }
.chart-wrap { height:200px; position:relative; }
.chart-wrap.tall { height:280px; }

/* COMMENTS */
.comments-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin:1.5rem 0 10px; }
.comments-filters { display:flex; gap:6px; flex-wrap:wrap; }
.score-filter-btn { font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; border:1.5px solid var(--gray-border); background:var(--white); cursor:pointer; font-family:var(--font); transition:all .15s; }
.score-filter-btn.active { background:var(--teal); border-color:var(--teal); color:var(--white); }
.score-filter-btn.danger-active { background:var(--danger); border-color:var(--danger); color:var(--white); }
.score-filter-btn.warn-active { background:var(--warning); border-color:var(--warning); color:var(--white); }

.comments-list { display:flex; flex-direction:column; gap:8px; margin-bottom:1.5rem; }
.comment-card { background:var(--white); border-radius:var(--radius); border:1px solid var(--gray-border); padding:12px 16px; box-shadow:var(--shadow); }
.comment-card.negative { border-left:3px solid var(--danger); }
.comment-card.warning { border-left:3px solid var(--warning); }
.comment-card.positive { border-left:3px solid var(--teal); }
.comment-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; flex-wrap:wrap; gap:4px; }
.comment-sede { font-size:12px; font-weight:700; color:var(--teal-dark); }
.comment-score { font-size:11px; font-weight:700; }
.comment-date { font-size:10px; color:var(--gray); margin-top:2px; }
.comment-text { font-size:13px; color:var(--gray-dark); line-height:1.5; }
.comments-count { font-size:12px; color:var(--gray); }
.load-more-btn { width:100%; padding:10px; background:var(--gray-light); border:1px solid var(--gray-border); border-radius:var(--radius-sm); font-family:var(--font); font-size:13px; font-weight:600; color:var(--gray); cursor:pointer; margin-bottom:1.5rem; }
.load-more-btn:hover { background:var(--teal-light); color:var(--teal-dark); }

/* TREND INDICATOR */
.trend-up::before { content:'↑ '; }
.trend-down::before { content:'↓ '; }

/* DETAIL VIEW */
.detail-header { display:flex; align-items:center; gap:16px; margin-bottom:1.5rem; flex-wrap:wrap; }
.detail-sede-name { font-size:22px; font-weight:700; }
.detail-sub { font-size:13px; color:var(--gray); }

/* CENAS */
.cenas-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-bottom:1.25rem; }
.cenas-card { background:var(--white); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); border:1px solid var(--gray-border); }
.cenas-label { font-size:11px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
.cenas-val { font-size:24px; font-weight:700; }
.cenas-bar { height:4px; border-radius:2px; margin-top:8px; background:var(--gray-border); }
.cenas-fill { height:4px; border-radius:2px; }
.cenas-threshold { font-size:10px; color:var(--gray); margin-top:4px; }

/* LOADING */
.loading { display:flex; align-items:center; justify-content:center; min-height:300px; color:var(--gray); font-size:14px; gap:10px; flex-direction:column; }
.spinner { width:28px; height:28px; border:3px solid var(--gray-border); border-top-color:var(--teal); border-radius:50%; animation:spin .7s linear infinite; }
.loading-sub { font-size:12px; color:var(--gray); margin-top:4px; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty { text-align:center; padding:3rem; color:var(--gray); font-size:14px; }

/* GAP / PENDING DATA NOTICE */
.gap-box { background:var(--warning-light); border:1px solid #F5DDAE; border-radius:var(--radius); padding:1rem 1.25rem; margin-bottom:1.25rem; }
.gap-box-title { font-size:12px; font-weight:700; color:#7A4F06; letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px; }
.gap-box-text { font-size:13px; line-height:1.5; color:#7A4F06; }
.info-box { background:var(--teal-light); border:1px solid #BFE6DA; border-radius:var(--radius); padding:1rem 1.25rem; margin-bottom:1.25rem; }
.info-box-title { font-size:12px; font-weight:700; color:var(--teal-dark); letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px; }
.info-box-text { font-size:13px; line-height:1.5; color:var(--teal-dark); }

/* CUSTOM FILTER BAR (Demoras / Reclamos) */
.subtoolbar { background:var(--white); border:1px solid var(--gray-border); border-radius:var(--radius); padding:10px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:1.25rem; }
.subtoolbar select { font-family:var(--font); font-size:12px; font-weight:600; padding:6px 10px; border-radius:20px; border:1.5px solid var(--gray-border); background:var(--white); color:var(--gray-dark); cursor:pointer; }
.subtoolbar select:focus { outline:none; border-color:var(--teal); }

.rank-list { display:flex; flex-direction:column; gap:6px; }
.rank-row { display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:var(--radius-sm); background:var(--gray-light); }
.rank-pos { font-size:13px; font-weight:700; color:var(--gray); min-width:20px; }
.rank-name { font-size:13px; font-weight:600; flex:1; min-width:120px; }
.rank-bar-wrap { flex:2; height:8px; background:var(--gray-border); border-radius:4px; min-width:80px; }
.rank-bar-fill { height:8px; border-radius:4px; }
.rank-val { font-size:13px; font-weight:700; min-width:70px; text-align:right; }

/* DROPZONE (carga de CSV/Excel en vivo) */
.dropzone { border:2px dashed var(--teal-mid); border-radius:var(--radius); padding:1.25rem; text-align:center; background:var(--teal-light); margin-bottom:1.25rem; cursor:pointer; transition:all .15s; }
.dropzone:hover, .dropzone.dragover { background:#DCF3EC; border-color:var(--teal); }
.dropzone-title { font-size:13px; font-weight:700; color:var(--teal-dark); margin-bottom:4px; }
.dropzone-sub { font-size:12px; color:var(--gray); }
.dropzone input[type=file] { display:none; }
.data-status-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--white); border:1px solid var(--gray-border); border-radius:var(--radius-sm); padding:8px 14px; margin-bottom:1.25rem; font-size:12px; color:var(--gray-dark); }
.data-status-bar button { font-size:11px; font-weight:600; padding:5px 12px; border-radius:20px; border:1.5px solid var(--gray-border); background:var(--white); color:var(--gray); cursor:pointer; font-family:var(--font); }
.data-status-bar button:hover { border-color:var(--teal); color:var(--teal-dark); }

/* UPLOAD DROPZONE (Reclamos) */
.dropzone { border:2px dashed var(--gray-border); border-radius:var(--radius); padding:2.5rem 1.5rem; text-align:center; background:var(--white); cursor:pointer; transition:all .15s; margin-bottom:1.25rem; }
.dropzone:hover, .dropzone.dragover { border-color:var(--teal); background:var(--teal-light); }
.dropzone-icon { font-size:32px; margin-bottom:8px; }
.dropzone-title { font-size:14px; font-weight:700; color:var(--gray-dark); margin-bottom:4px; }
.dropzone-sub { font-size:12px; color:var(--gray); }
.upload-status { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; background:var(--teal-light); border:1px solid #BFE6DA; border-radius:var(--radius-sm); padding:10px 16px; margin-bottom:1.25rem; font-size:13px; color:var(--teal-dark); }
.upload-status button { font-family:var(--font); font-size:12px; font-weight:600; padding:5px 12px; border-radius:20px; border:1.5px solid var(--teal); background:var(--white); color:var(--teal-dark); cursor:pointer; }
.upload-status button:hover { background:var(--teal); color:var(--white); }
.upload-error { background:var(--danger-light); border:1px solid #F5BFBF; border-radius:var(--radius-sm); padding:10px 16px; margin-bottom:1.25rem; font-size:13px; color:#8B1A1A; }

@media (max-width:768px) {
  .main { padding:1rem; }
  .charts-grid { grid-template-columns:1fr; }
  .header,.toolbar,.tabs { padding-left:1rem; padding-right:1rem; }
  .search-box { width:100%; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <img src="logo-delacanada.png" class="login-logo" alt="del a Cañada — Sanatorios y Policlínicas" onerror="this.style.display='none'">
    <div class="login-title">Tablero de Experiencia del Paciente</div>
    <div class="login-sub">Ingresá tu contraseña para acceder</div>
    <input type="password" id="login-input" class="login-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<div id="dashboard">
  <div class="header">
    <div class="header-left" onclick="goHome()" style="cursor:pointer" title="Volver al inicio">
      <img src="logo-delacanada.png" class="header-logo" alt="del a Cañada — Sanatorios y Policlínicas" onerror="this.style.display='none'">
      <div class="header-title">Experiencia del Paciente</div>
    </div>
    <div class="header-right">
      <span class="header-tag" id="last-update">Cargando...</span>
      <button class="logout-btn" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('ambulatorio',this)">🏥 Ambulatorio</button>
    <button class="tab-btn" onclick="setTab('internacion',this)">🛏️ Internación</button>
    <button class="tab-btn" onclick="setTab('demoras',this)">⏱️ Demoras</button>
    <button class="tab-btn" onclick="setTab('reclamos',this)">📋 Reclamos</button>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <span class="filter-label">Período:</span>
      <button class="filter-btn active" onclick="setPeriodo('30',this)">30 días</button>
      <button class="filter-btn" onclick="setPeriodo('90',this)">90 días</button>
      <button class="filter-btn" onclick="setPeriodo('365',this)">1 año</button>
      <button class="filter-btn" onclick="setPeriodo('todos',this)">Todo</button>
      <span class="filter-label" id="int-filter-label" style="margin-left:12px;display:none">Tipo:</span>
      <button class="filter-btn active" id="int-filter-btn-ambos" onclick="setIntFilter('ambos',this)" style="display:none">Ambos</button>
      <button class="filter-btn" id="int-filter-btn-estadía" onclick="setIntFilter('estadía',this)" style="display:none">Durante estadía</button>
      <button class="filter-btn" id="int-filter-btn-alta" onclick="setIntFilter('alta',this)" style="display:none">Al alta</button>
    </div>
    <input type="text" class="search-box" id="search-box" placeholder="🔍 Buscar en comentarios..." oninput="onSearch()">
  </div>

  <div class="main" id="main-content">
    <div class="loading"><div class="spinner"></div><div class="loading-sub">Cargando datos...</div></div>

// ─── PERSISTENCIA LOCAL (IndexedDB) ──────────────────
// Guarda los datasets subidos (Atenciones, Tótem, Reclamos) en el navegador
// para que sigan disponibles al volver a abrir el tablero, sin re-subir nada.
const IDB_NAME = 'tableroPX'
const IDB_STORE = 'datasets'
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1)
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE) }
    req.onsuccess = () => resolve(req.result)
    req.onerror = () => reject(req.error)
  })
}
async function idbSet(key, value) {
  try {
    const db = await idbOpen()
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite')
      tx.objectStore(IDB_STORE).put(value, key)
      tx.oncomplete = () => resolve(true)
      tx.onerror = () => reject(tx.error)
    })
  } catch (e) { console.warn('No se pudo guardar en IndexedDB:', e); return false }
}
async function idbGet(key) {
  try {
    const db = await idbOpen()
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly')
      const req = tx.objectStore(IDB_STORE).get(key)
      req.onsuccess = () => resolve(req.result ?? null)
      req.onerror = () => reject(req.error)
    })
  } catch (e) { console.warn('No se pudo leer de IndexedDB:', e); return null }
}
async function idbDelete(key) {
  try {
    const db = await idbOpen()
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite')
      tx.objectStore(IDB_STORE).delete(key)
      tx.oncomplete = () => resolve(true)
      tx.onerror = () => reject(tx.error)
    })
  } catch (e) { return false }
}

// ─── DATA LOADING ────────────────────────────────────
async function loadData() {
  setLoading('Cargando datos...')
  let all = [], from = 0, huboError = false
  while (true) {
    const { data, error } = await db.from('encuestas').select('*').order('created_at',{ascending:false}).range(from, from+999)
    if (error) { huboError = true; console.error('Error cargando encuestas desde Supabase:', error); break }
    if (!data || data.length===0) break
    all = all.concat(data)
    if (data.length < 1000) break
    from += 1000
    setLoading(`Cargando... ${all.length} registros`)
  }
  // Normalizar el código de sede (espacios en blanco al final duplicaban sedes en las tablas/comentarios)
  all.forEach(r => { if (r.sede) r.sede = String(r.sede).trim() })
  allData = all
  // Diagnóstico visible: rango real de fechas cargadas + aviso si la carga se cortó por un error.
  // Esto ayuda a distinguir "el filtro de período no funciona" de "los datos cargados son todos recientes".
  const fechas = all.map(r => new Date(r.fecha_respuesta || r.created_at)).filter(d => !isNaN(d))
  let rangoTxt = ''
  if (fechas.length) {
    const min = new Date(Math.min.apply(null, fechas))
    const max = new Date(Math.max.apply(null, fechas))
    rangoTxt = ` · datos del ${formatDate(min)} al ${formatDate(max)}`
  }
  const avisoError = huboError ? ' ⚠️ carga incompleta (error de conexión — recargá la página)' : ''
  document.getElementById('last-update').textContent = `${allData.length.toLocaleString()} respuestas${rangoTxt}${avisoError}`
  render()
}

function setLoading(msg) {

function getFiltered() {
  let data = [...allData]
  const isAmb = state.tab === 'ambulatorio'
  data = data.filter(r => r.tipo_formulario && (isAmb
    ? r.tipo_formulario.toLowerCase().includes('ambulatori')
    : !r.tipo_formulario.toLowerCase().includes('ambulatori')))
  if (!isAmb) {
    if (state.intFilter === 'estadía') data = data.filter(r => r.sede && !r.sede.includes('ALTA'))
    else if (state.intFilter === 'alta') data = data.filter(r => r.sede && r.sede.includes('ALTA'))
  }
  if (state.periodo !== 'todos') {
    const cutoff = new Date()
    cutoff.setDate(cutoff.getDate() - parseInt(state.periodo))
    data = data.filter(r => {
      const dateStr = r.fecha_respuesta || r.created_at
      if (!dateStr) return false
      const d = new Date(dateStr)
      return !isNaN(d) && d >= cutoff
    })
  }
  if (state.selectedSede) data = data.filter(r => r.sede === state.selectedSede)
  return data
}

}
function sedeLabel(s) { return sedeLabels[s] || s }

function avg(arr, key) {
  const v = arr.map(r=>parseFloat(r[key])).filter(v=>!isNaN(v)&&v>0)
  return v.length ? (v.reduce((a,b)=>a+b,0)/v.length) : null
}
function avgF(arr, key) {
  const a = avg(arr,key); return a ? parseFloat(a.toFixed(1)) : null
}
// Igual que avgF, pero calculando el puntaje fila por fila con scoreFn en vez de una sola
// columna fija — necesario en Internación porque Durante y Alta usan columnas distintas
// (p4/p5/p8 vs p6/p7/p12) y un mismo sector puede mezclar ambos tipos de encuesta.
function avgPerRowScore(arr, scoreFn) {
  const v = arr.map(scoreFn).filter(v=>!isNaN(v)&&v>0)
  return v.length ? parseFloat((v.reduce((a,b)=>a+b,0)/v.length).toFixed(1)) : null
}

function scoreColor(v, max) {
  if (v===null) return '#9B9B9B'
  const t = max===10 ? [7,5] : [4,3]
  return v>=t[0] ? '#2BA98B' : v>=t[1] ? '#EF9F27' : '#E24B4A'
}
function kpiClass(v, max) {
  if (!v) return ''
  const t = max===10 ? [7,5] : [4,3]
  return v>=t[0] ? 'ok' : v>=t[1] ? 'warn' : 'danger'
}
function badgeHtml(v, max) {
  if (v===null) return '<span class="badge badge-ok">—</span>'
  const t = max===10 ? [7,5] : [4,3]
  if (v>=t[0]) return '<span class="badge badge-ok">Normal</span>'
  if (v>=t[1]) return '<span class="badge badge-warn">Atención</span>'
  return '<span class="badge badge-danger">Alerta</span>'
}
function scoreBarHtml(v, max) {
  if (v===null) return '<span style="color:var(--gray)">—</span>'
  const pct = (v/max)*100
  const c = scoreColor(v,max)
  return `<div class="score-wrap"><span class="score-num" style="color:${c}">${v}</span><div class="score-bar"><div class="score-fill" style="width:${pct}%;background:${c}"></div></div></div>`
}
function formatDate(d) {
  if (!d) return '—'
  try {
    const dt = new Date(d)
    if (isNaN(dt)) return '—'
    return dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})
  } catch { return '—' }
}
function trend(curr, prev) {
  if (!curr || !prev) return ''
  const diff = (curr-prev).toFixed(1)
  if (Math.abs(diff) < 0.1) return ''
  return diff > 0
    ? `<div class="kpi-trend up">↑ ${diff} vs período anterior</div>`
    : `<div class="kpi-trend down">↓ ${Math.abs(diff)} vs período anterior</div>`
}

  return allData.filter(r => {
    const d = new Date(r.fecha_respuesta || r.created_at)

      r.tipo_formulario && (isAmb
        ? r.tipo_formulario.toLowerCase().includes('ambulatori')
        : !r.tipo_formulario.toLowerCase().includes('ambulatori'))
  })
}

function renderGeneral() {

  // KPI cards
  html += `<div class="kpi-grid">${kpis.map(k=>{
    const intIsAltaKpi = !isAmb && data.some(function(r){return r.tipo_formulario&&r.tipo_formulario.toLowerCase().includes('alta')}) && !data.some(function(r){return r.tipo_formulario&&!r.tipo_formulario.toLowerCase().includes('alta')&&!r.tipo_formulario.toLowerCase().includes('ambulatori')})
    const v = (k.key === 'p12' && intIsAltaKpi) ? (avgF(data,'p12') || avgF(data,'p8')) : avgF(data, k.key)
    const vp = (k.key === 'p12' && intIsAltaKpi) ? (avgF(prev,'p12') || avgF(prev,'p8')) : avgF(prev, k.key)
    return `<div class="kpi-card">
      <div class="kpi-label">${k.label} — red</div>
      <div class="kpi-val ${kpiClass(v,max)}">${v||'—'}</div>
      <div class="kpi-sub">sobre ${max} · ${data.length.toLocaleString()} respuestas</div>
      ${trend(v,vp)}
    </div>`
  }).join('')}</div>`

  // Tabla sedes
  html += `<div class="section-label">Comparación por sede — clic para ver detalle</div>
  <div class="table-card"><table class="data-table">
    <thead><tr>
      <th onclick="sortTable('sede')">Sede</th>
      ${isAmb
        ? `<th onclick="sortTable('p1')">Médico</th><th onclick="sortTable('p2')">Recepción</th><th onclick="sortTable('p3')">NPS</th>`
        : `<th>Médico</th><th>Enfermería</th><th>Alimentación</th><th>Satisfacción</th>`}
      <th onclick="sortTable('count')">Respuestas</th><th>Negativos</th><th>Estado</th>
    </tr></thead>
    <tbody>${renderSedeRows(sedes, isAmb, max)}</tbody>
  </table></div>`

  // Charts
  const intIsAltaChart = !isAmb && data.some(r=>r.tipo_formulario&&r.tipo_formulario.toLowerCase().includes('alta')) && !data.some(r=>r.tipo_formulario&&!r.tipo_formulario.toLowerCase().includes('alta')&&!r.tipo_formulario.toLowerCase().includes('ambulatori'))
  const distKey = isAmb ? 'p3' : (intIsAltaChart ? 'p12' : 'p8')
  const dist = {}
  for (let i=1;i<=max;i++) dist[i]=0
  data.forEach(r=>{ const v=Math.round(parseFloat(r[distKey])); if(v>=1&&v<=max) dist[v]++ })

  const dimVals = isAmb
    ? [avgF(data,'p1'),avgF(data,'p2'),avgF(data,'p3')].map(v=>v||0)
    : [avgF(data,'p5'),avgF(data,'p4'),avgF(data,'p7'),avgF(data,'p8')].map(v=>v||0)
  const dimLabels = isAmb ? ['Médico','Recepción','NPS'] : ['Médico','Enfermería','Alimentación','Satisfacción']

  html += `<div class="charts-grid">
    <div class="chart-card"><div class="chart-title">Distribución de puntajes</div><div class="chart-wrap"><canvas id="chart-dist"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">Promedios por dimensión</div><div class="chart-wrap"><canvas id="chart-dims"></canvas></div></div>
  </div>`

  // Comments
  html += renderCommentsSection(data, isAmb, max)

  document.getElementById('main-content').innerHTML = html
  setTimeout(()=>{ renderChartDist(dist,max); renderChartDims(dimVals,dimLabels,max) },100)
}

function renderSedeRows(sedes, isAmb, max) {
  var entries = Object.entries(sedes).map(function(kv){
    var sede = kv[0], rows = kv[1]
    var vals = isAmb
      ? {p1:avgF(rows,'p1'), p2:avgF(rows,'p2'), p3:avgF(rows,'p3')}
      : (rows.some(function(r){return r.tipo_formulario&&r.tipo_formulario.toLowerCase().includes('alta')})
        ? {p6:avgF(rows,'p6'), p7:avgF(rows,'p7'), p8:avgF(rows,'p8'), p12:(avgF(rows,'p12') || avgF(rows,'p8'))}
        : {p4:avgF(rows,'p4'), p5:avgF(rows,'p5'), p7:avgF(rows,'p7'), p8:avgF(rows,'p8')})
    var allVals = Object.values(vals).filter(function(v){return v!==null && typeof v === 'number'})
    var worst = allVals.length ? Math.min.apply(null,allVals) : null
    // Antes esto usaba r.p12 directo, sin el fallback a p8. Los registros de Alta históricos que no tenían
    // p12 cargado (ver "Pendientes" del proyecto) quedaban siempre afuera del conteo de negativos, aunque
    // tuvieran un puntaje real bajo en p8 — por eso una sede podía mostrar "-" en Negativos y tener comentarios
    // negativos reales adentro. Ahora usa la misma función que el resto del tablero (getScoreForComment).
    var esGrupoAlta = rows.some(function(r2){return r2.tipo_formulario&&r2.tipo_formulario.toLowerCase().includes('alta')})
    var negCount = rows.filter(function(r){
      var v = isAmb ? getScoreForComment(r, true, false) : getScoreForComment(r, false, esGrupoAlta)
      return v!==null && v < (isAmb ? 5 : 3)
    }).length
    return {sede:sede, rows:rows, vals:vals, worst:worst, negCount:negCount}
  })

  // Custom order for internacion: group by sede, Durante before Alta
  var sedeOrder = ['INT_SC_CBA','INT_ALTA_SC_CBA','INT_SC_VM','INT_ALTA_SC_VM','INT_SC_RIO3','INT_ALTA_SC_RIO3','INT_SC_SARMIENTO','INT_ALTA_SC_SARMIENTO']
  if (!isAmb && !state.sortCol) {
    entries.sort(function(a,b){
      var ai = sedeOrder.indexOf(a.sede)
      var bi = sedeOrder.indexOf(b.sede)
      if (ai === -1) ai = 99
      if (bi === -1) bi = 99
      return ai - bi
    })
  } else if (state.sortCol) {
    entries.sort(function(a,b){
      var va,vb
      if (state.sortCol==='sede') { va=sedeLabel(a.sede); vb=sedeLabel(b.sede) }
      else if (state.sortCol==='count') { va=a.rows.length; vb=b.rows.length }
      else { va=a.vals[state.sortCol]||0; vb=b.vals[state.sortCol]||0 }
      return state.sortDir==='asc' ? (va>vb?1:-1) : (va<vb?1:-1)
    })
  }

  return entries.map(function(entry){
    var sede=entry.sede, rows=entry.rows, vals=entry.vals, worst=entry.worst, negCount=entry.negCount
    var scoreCols = isAmb
      ? '<td>'+scoreBarHtml(vals.p1,max)+'</td><td>'+scoreBarHtml(vals.p2,max)+'</td><td>'+scoreBarHtml(vals.p3,max)+'</td>'
      : (vals.p6 !== undefined
        ? '<td>'+scoreBarHtml(vals.p6,max)+'</td><td>'+scoreBarHtml(vals.p7,max)+'</td><td>'+scoreBarHtml(vals.p8,max)+'</td><td>'+scoreBarHtml(vals.p12,max)+'</td>'
        : '<td>'+scoreBarHtml(vals.p5,max)+'</td><td>'+scoreBarHtml(vals.p4,max)+'</td><td>'+scoreBarHtml(vals.p7,max)+'</td><td>'+scoreBarHtml(vals.p8,max)+'</td>')
    var negColor = negCount>0 ? 'var(--danger)' : 'var(--gray)'
    var negText = negCount>0 ? String(negCount)+' neg' : '-'
    var row = document.createElement('tr')
    row.setAttribute('onclick', 'openSede("' + sede + '")')
    row.innerHTML = '<td><div class="sede-name">'+sedeLabel(sede)+'</div><div class="click-hint">Ver detalle \u2192</div></td>'
      + scoreCols
      + '<td style="color:var(--gray)">'+rows.length.toLocaleString()+'</td>'
      + '<td style="color:'+negColor+'">'+negText+'</td>'
      + '<td>'+badgeHtml(worst,max)+'</td>'
    return row.outerHTML
  }).join('')
}
function sortTable(col) {
  if (state.sortCol===col) state.sortDir = state.sortDir==='asc'?'desc':'asc'
  else { state.sortCol=col; state.sortDir='desc' }
  render()
}

  // Si hay un sector seleccionado (clic en la tabla de "Desglose por sector"), los KPIs/gráficos/comentarios

  // Prev period for this sede (respeta también el sector si hay uno elegido)
  const prevAll = getPrevPeriodData(state.tab).filter(r=>r.sede===state.selectedSede && (!state.selectedSector || r.sector===state.selectedSector))

  const kpis = isAmb
    ? [{label:'Médico',key:'p1'},{label:'Recepción',key:'p2'},{label:'NPS',key:'p3'}]
    : [{label:'Médico',key:'p5'},{label:'Enfermería',key:'p4'},{label:'Satisfacción',key:'p8'},{label:'Alimentación',key:'p7'}]

  // Network avg for comparison
  const netData = allData.filter(r=>r.tipo_formulario&&(isAmb?r.tipo_formulario.toLowerCase().includes('ambulatori'):!r.tipo_formulario.toLowerCase().includes('ambulatori')))

  let html = `
    <button class="back-btn" onclick="goBack()">← Volver a todas las sedes</button>
    <div class="detail-header">
      <div>
        <div class="detail-sede-name">${sedeName}</div>
        <div class="detail-sub">${dataSector.length.toLocaleString()} respuestas en el período seleccionado${state.selectedSector ? ' · Sector: <strong>'+state.selectedSector+'</strong> <a href="#" onclick="selectSector(\''+state.selectedSector.replace(/'/g,"\\'")+'\');return false" style="color:var(--danger);font-weight:600;text-decoration:none;margin-left:4px">✕ quitar</a>' : ''}</div>
      </div>
    </div>`

  // KPI cards with comparison
  html += `<div class="kpi-grid">${kpis.map(k=>{
    const v = avgF(dataSector,k.key)
    const vp = avgF(prevAll,k.key)
    const vNet = avgF(netData,k.key)
    const diff = v && vNet ? (v-vNet).toFixed(1) : null
    const vsNet = diff ? `<div class="kpi-trend ${diff>=0?'up':'down'}">${diff>=0?'↑':'↓'} ${Math.abs(diff)} vs red</div>` : ''
    return `<div class="kpi-card">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val ${kpiClass(v,max)}">${v||'—'}</div>
      <div class="kpi-sub">sobre ${max}</div>
      ${trend(v,vp)}
      ${vsNet}
    </div>`
  }).join('')}</div>`



  // Sector breakdown for internacion — clic en una fila filtra todo lo de abajo por ese sector
  if (!isAmb && data.some(r => r.sector)) {
    var sectores = {}
    data.forEach(function(r) {
      if (!r.sector) return
      if (!sectores[r.sector]) sectores[r.sector] = []
      sectores[r.sector].push(r)
    })
    html += '<div class="section-label">Desglose por sector — clic para filtrar por sector</div>'
    html += '<div class="table-card"><table class="data-table">'
    html += '<thead><tr><th>Sector</th><th>Médico</th><th>Enfermería</th><th>Satisfacción</th><th>Respuestas</th></tr></thead><tbody>'
    Object.entries(sectores).forEach(function(kv) {
      var sec = kv[0], rows = kv[1]
      var m = avgPerRowScore(rows, function(r){ var alta = r.tipo_formulario && r.tipo_formulario.toLowerCase().includes('alta'); return parseFloat(alta ? r.p6 : r.p5) })
      var e = avgPerRowScore(rows, function(r){ var alta = r.tipo_formulario && r.tipo_formulario.toLowerCase().includes('alta'); return parseFloat(alta ? r.p7 : r.p4) })
      var s = avgPerRowScore(rows, function(r){ var alta = r.tipo_formulario && r.tipo_formulario.toLowerCase().includes('alta'); return getScoreForComment(r, false, alta) })
      var isActive = state.selectedSector === sec
      var secEscaped = sec.replace(/'/g, "\\'")
      html += '<tr onclick="selectSector(\'' + secEscaped + '\')" style="cursor:pointer' + (isActive ? ';background:var(--teal-light)' : '') + '">'
      html += '<td style="font-weight:600">' + sec + (isActive ? ' <span class="click-hint">(filtrando)</span>' : '') + '</td>'
      html += '<td>' + scoreBarHtml(m, 5) + '</td>'
      html += '<td>' + scoreBarHtml(e, 5) + '</td>'
      html += '<td>' + scoreBarHtml(s, 5) + '</td>'
      html += '<td style="color:var(--gray)">' + rows.length + '</td>'
      html += '</tr>'
    })
    html += '</tbody></table></div>'
  }

  // Detail charts
  const detailMax = isAmb ? 10 : 5
  const detailDist = {}
  for (let i=1;i<=detailMax;i++) detailDist[i]=0
  dataSector.forEach(r=>{
    const isAltaRow = !isAmb && r.tipo_formulario && r.tipo_formulario.toLowerCase().includes('alta')
    const v = Math.round(isAmb ? parseFloat(r.p3) : getScoreForComment(r, false, isAltaRow))
    if(v>=1&&v<=detailMax) detailDist[v]++
  })

  html += `<div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title">Evolución del puntaje en el tiempo</div>
      <div class="chart-wrap tall"><canvas id="chart-trend"></canvas></div>

      <div class="chart-title">Distribución de puntajes — esta sede</div>

  // Comments

  document.getElementById('main-content').innerHTML = html
  setTimeout(()=>{
    renderTrendChart(dataSector, isAmb)
    // Render detail dist

    dataSector.forEach(r=>{
      const isAltaRow = !isAmb && r.tipo_formulario && r.tipo_formulario.toLowerCase().includes('alta')
      const v = Math.round(isAmb ? parseFloat(r.p3) : getScoreForComment(r, false, isAltaRow))
      if(v>=1&&v<=ddm) dd[v]++
    })
    if(charts.detailDist) charts.detailDist.destroy()
    const ctx2 = document.getElementById('chart-detail-dist')
    if(ctx2) {
      const colors = ddm===10
        ? ['#E24B4A','#E24B4A','#E24B4A','#EF9F27','#EF9F27','#EF9F27','#F5C842','#5DCAA5','#2BA98B','#1E8A70']
        : ['#E24B4A','#EF9F27','#F5C842','#5DCAA5','#2BA98B']
      charts.detailDist = new Chart(ctx2,{type:'bar',data:{labels:Object.keys(dd).map(k=>k+'★'),datasets:[{data:Object.values(dd),backgroundColor:colors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#F0F0F0'},ticks:{font:{family:'Nunito'}}},x:{grid:{display:false},ticks:{font:{family:'Nunito'}}}}}})
    }
  }, 100)
}

// ─── COMMENTS ────────────────────────────────────────
function getScoreForComment(r, isAmb, isAlta) {
  if (isAmb) { var v = parseFloat(r.p3); return isNaN(v) ? null : v }
  if (isAlta) { var v12 = parseFloat(r.p12); if (!isNaN(v12)) return v12; var v8 = parseFloat(r.p8); return isNaN(v8) ? null : v8 }
  var v = parseFloat(r.p8); return isNaN(v) ? null : v
}

function renderCommentsSection(data, isAmb, max) {
  // Puntaje real por fila: en Alta usa p12 (con fallback p8); en Durante/Ambulatorio usa la lógica ya probada de getScoreForComment.
  // Antes esto usaba un scoreKey fijo ('p8') que en formularios de Alta corresponde a "alimentación", no a satisfacción general —
  // eso hacía que comentarios de Alta quedaran mal clasificados como negativos/positivos.
  function scoreForFilter(r) {
    const isAltaLocal = !isAmb && r.tipo_formulario && r.tipo_formulario.toLowerCase().includes('alta')
    return getScoreForComment(r, isAmb, isAltaLocal)
  }
  let comments = data.filter(r=>r.comentario&&r.comentario.trim().length>3)

  // Filter by score
  if (state.commentFilter === 'negative') comments = comments.filter(r=>{ const v=scoreForFilter(r); return v!==null&&v<(max===10?5:3) })
  else if (state.commentFilter === 'warning') comments = comments.filter(r=>{ const v=scoreForFilter(r); const t=max===10?[5,7]:[3,4]; return v!==null&&v>=t[0]&&v<t[1] })
  else if (state.commentFilter === 'positive') comments = comments.filter(r=>{ const v=scoreForFilter(r); return v!==null&&v>=(max===10?7:4) })

  // Search filter
  if (state.commentSearch) comments = comments.filter(r=>r.comentario.toLowerCase().includes(state.commentSearch))

  const shown = comments.slice(0, state.commentsShown)

  // Keyword analysis
  var temas = {
    'Espera / Demora': ['demora','espera','tardó','tardaron','tiempo','lento','lenta','rápido','rapidez'],
    'Trato del personal': ['trato','amable','amabilidad','cálido','fría','frio','maleducado','grosero','educado','atento','atentos'],
    'Alimentación': ['comida','alimentación','fría','caliente','menú','desayuno','almuerzo','cena','hambre'],
    'Limpieza': ['limpieza','limpio','sucio','higiene'],
    'Información / Comunicación': ['explicó','explicaron','informó','informaron','comunicó','información','explicación'],
    'Dolor / Procedimientos': ['dolor','procedimiento','cirugía','operación','medicación','medicamento','anestesia'],
    'Excelente atención': ['excelente','muy bien','muy buena','muy buen','felicitar','felicito','recomiendo','increíble','brillante','maravilloso']
  }

  // Agrupar los comentarios REALES por tema (no solo contarlos) para poder desplegarlos y leerlos por tema.
  // Esto corre sobre "comments" (que ya viene filtrado por tab Ambulatorio/Internación, período, sede y
  // por el filtro Negativos/Medios/Positivos activo) — funciona igual para las dos pestañas porque es la misma función.
  var temaComentarios = {}
  // "Excelente atención" es el único tema con palabras clave inherentemente positivas. Como la detección es por
  // palabra clave (no entiende sarcasmo/contexto), un comentario negativo puede mencionar "excelente" al pasar
  // (ej. "Dra excelente, lo malo fue la eterna espera") y quedar mal agrupado ahí. Por eso no tiene sentido
  // mostrar ese tema cuando estamos mirando específicamente Negativos o Medios.
  var temaKeys = Object.keys(temas)
  if (state.commentFilter === 'negative' || state.commentFilter === 'warning') {
    temaKeys = temaKeys.filter(function(t){ return t !== 'Excelente atención' })
  }
  temaKeys.forEach(function(tema) {
    var keywords = temas[tema]
    var matched = comments.filter(function(r) {
      var c = (r.comentario || '').toLowerCase()
      return keywords.some(function(k) { return c.includes(k) })
    })
    if (matched.length > 0) temaComentarios[tema] = matched
  })

  var temasHtml = ''
  if (Object.keys(temaComentarios).length > 0) {
    var sorted = Object.entries(temaComentarios).sort(function(a,b){return b[1].length-a[1].length})
    var maxVal = sorted[0][1].length
    var totalComentarios = comments.length
    temasHtml = '<div class="section-label" style="margin-top:1.5rem">Temáticas predominantes — de ' + totalComentarios + ' comentarios · clic en cada una para ver los comentarios</div>'
    temasHtml += '<div class="table-card" style="padding:0.25rem 1.25rem;margin-bottom:0.5rem">'
    temasHtml += sorted.map(function(kv) {
      var tema = kv[0], rows = kv[1]
      var cnt = rows.length
      var barPct = Math.round((cnt/maxVal)*100)
      var pctTotal = totalComentarios ? Math.round((cnt/totalComentarios)*100) : 0
      // El color ya no depende del filtro activo ni del nombre del tema — se calcula con el puntaje REAL
      // promedio de los comentarios que caen en ese tema. Así, si "Espera / Demora" tiene puntaje promedio
      // bajo, se ve rojo aunque estés mirando "Todos"; y si "Excelente atención" aparece en Negativos con
      // puntaje promedio bajo (comentarios sarcásticos/mixtos), también se ve rojo — coherente con la realidad.
      var scoresTema = rows.map(function(r){
        var isAltaLocal = !isAmb && r.tipo_formulario && r.tipo_formulario.toLowerCase().includes('alta')
        return getScoreForComment(r, isAmb, isAltaLocal)
      }).filter(function(v){ return v!==null })
      var avgTema = scoresTema.length ? scoresTema.reduce(function(a,b){return a+b},0)/scoresTema.length : null
      var color = avgTema===null ? 'var(--gray)' : scoreColor(avgTema, max)
      var itemsHtml = rows.map(function(r) {
        var isAltaLocal = !isAmb && r.tipo_formulario && r.tipo_formulario.toLowerCase().includes('alta')
        var v = getScoreForComment(r, isAmb, isAltaLocal)
        var scoreColorLocal = v!==null ? scoreColor(v, max) : '#9B9B9B'
        var scoreText = v!==null ? (v+'/'+max) : '—'
        var texto = limpiarComentario(r.comentario)
        return '<div style="padding:8px 0;border-bottom:1px solid var(--gray-border);font-size:12px">'
          + '<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:3px">'
          + '<span style="font-weight:700;color:var(--teal-dark)">' + sedeLabel(r.sede) + '</span>'
          + '<span style="font-weight:700;color:' + scoreColorLocal + '">' + scoreText + '</span>'
          + '</div>'
          + '<div style="color:var(--gray-dark);line-height:1.4">&quot;' + texto + '&quot;</div>'

// JotForm suele guardar los comentarios multilínea con tags <div>...</div> o <br> entre párrafos.
// Esto los convierte en saltos de línea reales en vez de mostrar el tag como texto literal ("<div>").
function limpiarComentario(texto) {
  if (!texto) return ''
  var t = String(texto)
    .replace(/<\/div>\s*<div>/gi, '\n')
    .replace(/<div>/gi, '')
    .replace(/<\/div>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]+>/g, '') // por si queda alguna otra etiqueta suelta
  t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  return t.split('\n').map(function(s){return s.trim()}).filter(Boolean).join('<br>')
}

function estimateMedian(bins, edges) {
  const total = bins.reduce((a,b)=>a+b,0)
  if (!total) return null
  const half = total/2
  let cum = 0
  for (let i=0;i<bins.length;i++) {
    if (cum + bins[i] >= half) {
      const L = edges[i], h = edges[i+1]-edges[i], f = bins[i]
      if (f===0) return L
      return L + ((half-cum)/f)*h
    }
    cum += bins[i]
  }
  return edges[edges.length-1]
}
function estimatePercentile(bins, edges, p) {
  const total = bins.reduce((a,b)=>a+b,0)
  if (!total) return null
  const target = total*p
  let cum = 0
  for (let i=0;i<bins.length;i++) {
    if (cum + bins[i] >= target) {
      const L = edges[i], h = edges[i+1]-edges[i], f = bins[i]
      if (f===0) return L
      return L + ((target-cum)/f)*h
    }
    cum += bins[i]
  }
  return edges[edges.length-1]
}

function demorasAgg(rows) {
  const D = demorasActiveData()
  const labIdx = D.servicios.indexOf('LABORATORIO INTERNO')
  let n=0, eN=0, eSum=0
  let dN=0, dSum=0            // duración SIN laboratorio — la que se muestra como "duración de consulta"
  let dNLab=0, dSumLab=0      // duración SOLO laboratorio, aparte
  let tN=0, tSum=0, guardia=0, primeraSi=0, primeraNo=0
  let enfN=0, enfSum=0
  const eBins=[0,0,0,0,0,0], dBins=[0,0,0,0,0,0], tBins=[0,0,0,0,0,0,0]
  rows.forEach(r=>{
    n += r[D_IDX.n]
    eN += r[D_IDX.eN]; eSum += r[D_IDX.eSum]
    const isLab = labIdx!==-1 && r[D_IDX.servicio]===labIdx
    if (isLab) { dNLab += r[D_IDX.dN]; dSumLab += r[D_IDX.dSum] }
    else { dN += r[D_IDX.dN]; dSum += r[D_IDX.dSum] }
    tN += r[D_IDX.tN]; tSum += r[D_IDX.tSum]
    guardia += r[D_IDX.guardia]; primeraSi += r[D_IDX.primeraSi]; primeraNo += r[D_IDX.primeraNo]
    enfN += (r[D_IDX.enfN]||0); enfSum += (r[D_IDX.enfSum]||0)
    for(let i=0;i<6;i++){ eBins[i]+=r[D_IDX.eB+i]; if(!isLab) dBins[i]+=r[D_IDX.dB+i] }
    for(let i=0;i<7;i++){ tBins[i]+=r[D_IDX.tB+i] }
  })
  const eMediana = estimateMedian(eBins, D.espera_bins)
  const dMediana = estimateMedian(dBins, D.dur_bins)
  const tMediana = estimateMedian(tBins, D.total_bins)
  const eSobre30 = eN ? (eBins.slice(2).reduce((a,b)=>a+b,0)/eN*100) : null
  return {
    n, eN, eAvg: eN? eSum/eN : null, eMediana, eSobre30, eBins,
    dN, dAvg: dN? dSum/dN : null, dMediana, dBins,
    dNLab, dAvgLab: dNLab? dSumLab/dNLab : null,
    tN, tAvg: tN? tSum/tN : null, tMediana, tBins,
    guardia, primeraSi, primeraNo,

    primeraPct: (primeraSi+primeraNo) ? primeraSi/(primeraSi+primeraNo)*100 : null,
    enfN, enfAvg: enfN ? enfSum/enfN : null,
  }
}

// ─── Parseo de fechas de SheetJS (Excel) ─────────────
// SheetJS con cellDates:true devuelve Date "ancladas" en UTC que en realidad
// representan la hora naive de la planilla. Para extraer día/hora hay que usar
// SIEMPRE los getters UTC (getUTCHours, etc.), nunca los locales — si no, el
// huso horario del navegador corre todo. Para diferencias (minutos de espera)
// no importa, porque ambos extremos usan el mismo ancla y se cancela.
function xlsISODate(d) {
  if (!d) return null
  const pad = n=>String(n).padStart(2,'0')
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`
}
function xlsDiffMin(a,b) { if(!a||!b) return null; const v=(b.getTime()-a.getTime())/60000; return isNaN(v)?null:v }

const ESPERA_BINS = [0,15,30,60,120,240,480]
const DUR_BINS = [0,5,10,20,40,90,240]
const TOTAL_BINS = [0,15,30,60,120,240,480,720]
function binIndex(v, edges) {
  if (v===null || v===undefined || isNaN(v)) return -1
  if (v<edges[0] || v>edges[edges.length-1]) return -1
  for (let i=0;i<edges.length-1;i++) {
    if (i===edges.length-2) { if (v>=edges[i] && v<=edges[i+1]) return i }
    else if (v>=edges[i] && v<edges[i+1]) return i
  }
  return -1
}
function clasificarConvenio(conv) {
  const c = String(conv||'SIN CONVENIO').toUpperCase().trim()
  if (c==='SIN CONVENIO' || c==='') return 'Sin clasificar'
  if (c.includes('PAMI')||c.includes('APROSS')||c.includes('IOSFA')||c.startsWith('OSFA')||c.includes('OSFFESEG')||c.includes('INTERPROVINCIAL')) return 'Público'
  if (c==='GEA') return 'Interno'
  return 'Externo'
}

// ─── Procesar Excel de Consulta Atenciones (drag-and-drop) ───
function processAtencionesWorkbook(wb, fileName) {
  const ws = wb.Sheets[wb.SheetNames[0]]
  const raw = XLSX.utils.sheet_to_json(ws, {range:0, header:1, defval:null})
  let headerRow = 7
  for (let i=0;i<Math.min(20, raw.length);i++) {
    if (raw[i] && raw[i][0] === 'Fecha Hora Recepción') { headerRow = i; break }
  }
  const rows = XLSX.utils.sheet_to_json(ws, {range:headerRow, defval:null, raw:true})
  if (!rows.length || !('Fecha Hora Recepción' in rows[0]) || !('Centro Atención' in rows[0])) {
    alert('El archivo no parece un export de "Consulta Atenciones" (no encontré las columnas esperadas). Probá con el Excel original, sin editar encabezados.')
    return
  }

  const centrosSet = new Set(), serviciosSet = new Set(), fechasSet = new Set()
  const servicioEspecialidad = {}
  const estadoTotal = {}
  const estadoPorCentro = {}
  const grupos = new Map() // key -> acumulador
  const convGrupos = new Map() // key centro|servicio|clasif -> {n,eN,eSum,eMax,dN,dSum}
  const profGrupos = new Map() // key centro|servicio|personal -> {n,eN,eSum,eMax,dN,dSum,tN,tSum}

  rows.forEach(row => {
    const centro = row['Centro Atención'] || 'SIN CENTRO'
    const estado = row['Estado'] || 'SIN ESTADO'
    estadoTotal[estado] = (estadoTotal[estado]||0)+1
    if (!estadoPorCentro[centro]) estadoPorCentro[centro] = {}
    estadoPorCentro[centro][estado] = (estadoPorCentro[centro][estado]||0)+1
    centrosSet.add(centro)

    if (estado !== 'FINALIZADA') return

    const servicio = row['Servicio'] || 'SIN SERVICIO'
    const especialidad = row['Especialidad'] || ''
    serviciosSet.add(servicio)
    if (!(servicio in servicioEspecialidad) && especialidad) servicioEspecialidad[servicio] = especialidad

    const fRecep = row['Fecha Hora Recepción']
    const fIni = row['Inicio Atención']
    const fFin = row['Fecha Fin Atención']
    if (!fRecep) return
    const fecha = xlsISODate(fRecep)
    fechasSet.add(fecha)

    const esperaMin = xlsDiffMin(fRecep, fIni)
    const duracionMin = xlsDiffMin(fIni, fFin)
    const totalMin = xlsDiffMin(fRecep, fFin)
    const eBin = (esperaMin!==null && esperaMin>=0 && esperaMin<=480) ? binIndex(esperaMin, ESPERA_BINS) : -1
    const dBin = (duracionMin!==null && duracionMin>=0 && duracionMin<=240) ? binIndex(duracionMin, DUR_BINS) : -1
    const tBin = (totalMin!==null && totalMin>=0 && totalMin<=720) ? binIndex(totalMin, TOTAL_BINS) : -1

    const enfIni = row['Inicio Atención Enfermería']
    const enfWaitMin = (fRecep && enfIni) ? xlsDiffMin(fRecep, enfIni) : null
    const enfValido = (enfWaitMin!==null && enfWaitMin>=0 && enfWaitMin<=480)

    const key = fecha+'|'+centro+'|'+servicio
    if (!grupos.has(key)) {
      grupos.set(key, {
        fecha, centro, servicio, n:0,
        eN:0, eSum:0, eBins:[0,0,0,0,0,0],
        dN:0, dSum:0, dBins:[0,0,0,0,0,0],
        tN:0, tSum:0, tBins:[0,0,0,0,0,0,0],
        guardia:0, primeraSi:0, primeraNo:0,
        enfN:0, enfSum:0,
      })
    }
    const g = grupos.get(key)
    g.n++
    if (eBin>=0) { g.eN++; g.eSum+=esperaMin; g.eBins[eBin]++ }
    if (dBin>=0) { g.dN++; g.dSum+=duracionMin; g.dBins[dBin]++ }
    if (tBin>=0) { g.tN++; g.tSum+=totalMin; g.tBins[tBin]++ }
    if (row['Desde Guardia']==='S') g.guardia++
    if (row['1° consulta']==='S') g.primeraSi++
    if (row['1° consulta']==='N') g.primeraNo++
    if (enfValido) { g.enfN++; g.enfSum+=enfWaitMin }

    const clasif = clasificarConvenio(row['Convenio'])
    const ckey = centro+'|'+servicio+'|'+clasif
    if (!convGrupos.has(ckey)) convGrupos.set(ckey, {centro, servicio, clasif, n:0, eN:0, eSum:0, eMax:null, eBins:[0,0,0,0,0,0], dN:0, dSum:0})
    const cg = convGrupos.get(ckey)
    cg.n++
    if (eBin>=0) { cg.eN++; cg.eSum+=esperaMin; cg.eBins[eBin]++; if (cg.eMax===null || esperaMin>cg.eMax) cg.eMax=esperaMin }

    const personal = (row['Personal']||'').trim()
    if (personal) {
      const pkey = centro+'|'+servicio+'|'+personal
      if (!profGrupos.has(pkey)) profGrupos.set(pkey, {centro, servicio, personal, n:0, eN:0, eSum:0, eMax:null, dN:0, dSum:0, tN:0, tSum:0})
      const pg = profGrupos.get(pkey)
      pg.n++
      if (eBin>=0) { pg.eN++; pg.eSum+=esperaMin; if (pg.eMax===null || esperaMin>pg.eMax) pg.eMax=esperaMin }
      if (dBin>=0) { pg.dN++; pg.dSum+=duracionMin }
      if (tBin>=0) { pg.tN++; pg.tSum+=totalMin }
    }
    if (dBin>=0) { cg.dN++; cg.dSum+=duracionMin }
  })

  const centros = Array.from(centrosSet).sort()
  const servicios = Array.from(serviciosSet).sort()
  const fechas = Array.from(fechasSet).sort()
  const centroIdx = Object.fromEntries(centros.map((c,i)=>[c,i]))
  const servicioIdx = Object.fromEntries(servicios.map((s,i)=>[s,i]))
  const fechaIdx = Object.fromEntries(fechas.map((f,i)=>[f,i]))

  const outRows = []
  grupos.forEach(g => {
    outRows.push([
      fechaIdx[g.fecha], centroIdx[g.centro], servicioIdx[g.servicio], g.n,
      g.eN, +g.eSum.toFixed(1), ...g.eBins,
      g.dN, +g.dSum.toFixed(1), ...g.dBins,
      g.tN, +g.tSum.toFixed(1), ...g.tBins,
      g.guardia, g.primeraSi, g.primeraNo,
      g.enfN, +g.enfSum.toFixed(1),
    ])
  })

  const hora_por_centro = {}, hora_total = new Array(24).fill(0)
  rows.forEach(row => {
    if (row['Estado']!=='FINALIZADA') return
    const fRecep = row['Fecha Hora Recepción']
    if (!fRecep) return
    const centro = row['Centro Atención'] || 'SIN CENTRO'
    const h = fRecep.getUTCHours()
    if (!hora_por_centro[centro]) hora_por_centro[centro] = new Array(24).fill(0)
    hora_por_centro[centro][h]++
    hora_total[h]++
  })

  const conv_rows = []
  convGrupos.forEach(cg => {
    conv_rows.push([centroIdx[cg.centro], servicioIdx[cg.servicio], cg.clasif, cg.n, cg.eN, +cg.eSum.toFixed(1), cg.dN, +cg.dSum.toFixed(1), cg.eMax===null?null:+cg.eMax.toFixed(1), cg.eBins])
  })

  const prof_rows = []
  profGrupos.forEach(pg => {
    prof_rows.push([centroIdx[pg.centro], servicioIdx[pg.servicio], pg.personal, pg.n, pg.eN, +pg.eSum.toFixed(1), pg.dN, +pg.dSum.toFixed(1), pg.eMax===null?null:+pg.eMax.toFixed(1), pg.tN, +pg.tSum.toFixed(1)])
  })

  const nTotal = rows.filter(r=>r['Estado']==='FINALIZADA').length
  const fechaMin = fechas[0], fechaMax = fechas[fechas.length-1]

  demorasLiveData = {
    centros, servicios, servicio_especialidad: servicioEspecialidad, fechas,
    espera_bins: ESPERA_BINS, dur_bins: DUR_BINS, total_bins: TOTAL_BINS,
    rows: outRows,
    estado_por_centro: estadoPorCentro, estado_total: estadoTotal,
    hora_por_centro, hora_total,
    conv_rows, prof_rows,
    meta: {
      n_total: nTotal, n_total_bruto: rows.length,
      fecha_min: fechaMin, fecha_max: fechaMax,
    },
    fileName,
  }
  demorasState = { periodo:'todo', centro:'todos', servicio:'todos', sortCol:null, sortDir:'desc' }
  idbSet('atenciones', demorasLiveData)
  render()
}

// ─── Procesar Excel de Tótem (Consulta Triage) — acumula por sede ───
const RECEPCION_SEDE_MAP = {
  'RECEPCION ESPECIALIDADES': 'SANATORIO DE LA CAÑADA',
  'RECEPCION IMAGENES': 'SANATORIO DE LA CAÑADA',
  'RECEPCION OFTALMOLOGIA': 'SANATORIO DE LA CAÑADA',
  'RECEPCION PRINCIPAL': 'SANATORIO DE LA CAÑADA VILLA MARIA',
  'RECEPCION PB': 'SANATORIO DE LA CAÑADA RIO III',
  'RECEPCION POLICLINICA PUCARA': 'POLICLINICA PUCARA C+ CBA',
  'RECEPCION HEMODINAMIA': 'HEMODINAMIA DEL CENTRO',
  // 'ASISTENCIA MEDICA VIRTUAL' se descarta a propósito (parece dato de prueba)
}
function processTotemWorkbook(wb, fileName) {
  const ws = wb.Sheets[wb.SheetNames[0]]
  const raw = XLSX.utils.sheet_to_json(ws, {range:0, header:1, defval:null})
  let headerRow = 7
  for (let i=0;i<Math.min(20, raw.length);i++) {
    if (raw[i] && raw[i][0] === 'Lugar Espera') { headerRow = i; break }
  }
  const rows = XLSX.utils.sheet_to_json(ws, {range:headerRow, defval:null, raw:true})
  if (!rows.length || !('Fecha Emisión' in rows[0]) || !('Recepción' in rows[0])) {
    alert('El archivo no parece un export de "Consulta Triage" (tótem). Probá con el Excel original.')
    return
  }
  const bySedeInFile = {} // sede -> array de {espera, fecha, puesto}
  let nDescartadosSinMapeo = 0, nPendientes = 0
  rows.forEach(row => {
    if (row['Estado'] !== 'LLAMADO') { nPendientes++; return }
    const recepcionRaw = (row['Recepción']||'').trim()
    const sede = RECEPCION_SEDE_MAP[recepcionRaw]
    if (!sede) { nDescartadosSinMapeo++; return }
    const espera = row['Tiempo Espera']
    const fEmi = row['Fecha Emisión']
    if (espera===null || espera===undefined || !fEmi) return
    if (!bySedeInFile[sede]) bySedeInFile[sede] = []
    bySedeInFile[sede].push({ espera: Number(espera), fecha: xlsISODate(fEmi), puesto: row['Puesto Recepción']||'', personal: (row['Personal Llama']||'').trim()||'Sin dato', recepcionRaw })
  })

  if (!totemLiveData) totemLiveData = { bySede:{} }
  const sedesActualizadas = []
  Object.entries(bySedeInFile).forEach(([sede, records]) => {
    if (!records.length) return
    totemLiveData.bySede[sede] = { records, fileName, uploadedAt: new Date().toISOString() }
    sedesActualizadas.push(centroLabelD(sede))
  })

  if (!sedesActualizadas.length) {
    alert('No encontré tickets con una Recepción reconocida en este archivo. Recepciones vistas: ' +
      Array.from(new Set(rows.map(r=>r['Recepción']))).filter(Boolean).join(', '))
    return
  }
  idbSet('totem', totemLiveData)
  render()
  alert('Tótem actualizado para: ' + sedesActualizadas.join(', ') + (nDescartadosSinMapeo?` (se ignoraron ${nDescartadosSinMapeo} tickets sin sede reconocida, ej. Asistencia Médica Virtual)`:''))
}
function handleTotemFile(file) {
  if (!file) return
  setLoadingDropzone('totem-dropzone', 'Procesando '+file.name+'…')
  const reader = new FileReader()
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true})
      processTotemWorkbook(wb, file.name)
    } catch (err) {
      alert('No pude leer el archivo: '+err.message)
      render()
    }
  }
  reader.onerror = () => { alert('No pude leer el archivo.'); render() }
  reader.readAsArrayBuffer(file)
}

function totemStatsForSede(sedeKey, periodo) {
  if (!totemLiveData || !totemLiveData.bySede[sedeKey]) return null
  let recs = totemLiveData.bySede[sedeKey].records
  if (periodo !== 'todo') {
    const days = parseInt(periodo)
    const fechas = recs.map(r=>r.fecha).sort()
    if (!fechas.length) return null
    const lastDate = parseLocalDate(fechas[fechas.length-1])
    const cutoff = new Date(lastDate); cutoff.setDate(cutoff.getDate()-days)
    recs = recs.filter(r => parseLocalDate(r.fecha) >= cutoff)
  }
  if (!recs.length) return null
  const vals = recs.map(r=>r.espera).sort((a,b)=>a-b)
  const n = vals.length
  const mediana = n%2 ? vals[(n-1)/2] : (vals[n/2-1]+vals[n/2])/2
  const promedio = vals.reduce((a,b)=>a+b,0)/n
  return { n, mediana, promedio }
}

let totemState = { sedeSeleccionada: null }
function setTotemSedeSeleccionada(sede) { totemState.sedeSeleccionada = (totemState.sedeSeleccionada===sede ? null : sede); render() }

function renderTotemPorPersonal(sede) {
  if (!totemLiveData || !totemLiveData.bySede[sede]) return '<div class="empty">Sin datos.</div>'
  const recs = totemLiveData.bySede[sede].records
  const agg = {}
  recs.forEach(r=>{
    const p = r.personal || 'Sin dato'
    if (!agg[p]) agg[p] = []
    agg[p].push(r.espera)
  })
  let list = Object.entries(agg).map(([personal, esperas])=>{
    const sorted = [...esperas].sort((a,b)=>a-b)
    const n = sorted.length
    const mediana = n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2
    const promedio = esperas.reduce((a,b)=>a+b,0)/n
    const maxima = sorted[n-1]
    return { personal, n, mediana, promedio, maxima }
  })
  const dir = demorasUI.totemSortDir === 'asc' ? 1 : -1
  list.sort((a,b)=> dir * (a.promedio-b.promedio))
  if (!list.length) return '<div class="empty">Sin datos.</div>'
  return `
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px">
      <span class="filter-label">Ordenar espera:</span>
      <button class="filter-btn ${demorasUI.totemSortDir==='desc'?'active':''}" onclick="setTotemSortDir('desc')">Mayor primero</button>
      <button class="filter-btn ${demorasUI.totemSortDir==='asc'?'active':''}" onclick="setTotemSortDir('asc')">Menor primero</button>
    </div>
    <table class="data-table" style="margin:0 -1.25rem;width:calc(100% + 2.5rem)">
    <thead><tr><th>Recepcionista</th><th>Espera (mediana)</th><th>Espera (promedio)</th><th>Espera máxima</th><th>Tickets llamados</th></tr></thead>
    <tbody>${list.map(p=>`<tr><td>${p.personal}</td><td>${fmtMin(p.mediana)}</td><td>${fmtMin(p.promedio)}</td><td>${fmtMin(p.maxima)}</td><td style="color:var(--gray)">${p.n.toLocaleString()}</td></tr>`).join('')}</tbody>
  </table>`
}

function convLabel(k) { return k==='Interno' ? 'GEA (obra social del grupo)' : k }

function renderConvenioRows(convAgg, D) {
  const order = ['Externo','Público','Interno','Sin clasificar']
  const total = Object.values(convAgg).reduce((a,c)=>a+c.n,0)
  const keys = order.filter(k=>convAgg[k])
  Object.keys(convAgg).forEach(k=>{ if(!keys.includes(k)) keys.push(k) })
  if (!keys.length) return '<tr><td colspan="6" class="empty">Sin datos.</td></tr>'
  return keys.map(k=>{
    const c = convAgg[k]
    const eAvg = c.eN ? c.eSum/c.eN : null
    const dAvg = c.dN ? c.dSum/c.dN : null
    const pct = total ? (c.n/total*100) : null
    const highlight = k==='Externo' ? 'font-weight:700;color:var(--teal-dark)' : ''
    const p90 = c.eBins ? estimatePercentile(c.eBins, D.espera_bins, 0.9) : null
    let dondeHtml = ''
    if (c.eMaxCentro!==null && c.eMaxCentro!==undefined) {
      const centroNom = centroLabelD(D.centros[c.eMaxCentro])
      const servNom = (c.eMaxServicio!==null && c.eMaxServicio!==undefined) ? D.servicios[c.eMaxServicio] : null
      dondeHtml = `<div style="font-size:10px;color:var(--gray)">${centroNom}${servNom ? ' · '+servNom : ''}</div>`
    }
    return `<tr><td style="${highlight}">${convLabel(k)}${k==='Externo'?' ★':''}</td><td>${c.n.toLocaleString()}</td><td>${fmtPct(pct)}</td><td>${fmtMin(eAvg)}</td><td>${fmtMin(p90)}</td><td>${fmtMin(c.eMax)}${dondeHtml}</td><td>${fmtMin(dAvg)}</td></tr>`
  }).join('')
}

function renderGuardiaDemandaRows(rows, D) {
  // Grupo 1: por Servicio, para los servicios de Demanda Espontánea (dato completo: espera+duración)
  // "Demanda Espontánea 2" es la misma atención que "Demanda Espontánea", solo que en CBA
  // se maneja como una segunda cola en paralelo por volumen — se unifican en el reporte.
  const normalizarServicio = s => /DEMANDA ESPONT/i.test(s) ? 'Demanda Espontánea' : s
  const porServicio = {}
  rows.forEach(r=>{
    const sRaw = D.servicios[r[D_IDX.servicio]]
    if (!/DEMANDA ESPONT/i.test(sRaw)) return
    const s = normalizarServicio(sRaw)
    if (!porServicio[s]) porServicio[s] = { n:0, eBins:[0,0,0,0,0,0], dBins:[0,0,0,0,0,0] }
    porServicio[s].n += r[D_IDX.n]
    for (let i=0;i<6;i++){ porServicio[s].eBins[i]+=r[D_IDX.eB+i]; porServicio[s].dBins[i]+=r[D_IDX.dB+i] }
  })
  // Grupo 2: el flag "Desde Guardia" en general (solo conteo — no tenemos espera/duración separadas para este flag)
  let nGuardiaFlag=0, nTotal=0
  rows.forEach(r=>{ nGuardiaFlag += r[D_IDX.guardia]; nTotal += r[D_IDX.n] })

  let html = ''
  const entries = Object.entries(porServicio).sort((a,b)=>b[1].n-a[1].n)
  if (!entries.length) {
    html += '<tr><td colspan="4" class="empty">No hay atenciones de Demanda Espontánea en este filtro.</td></tr>'
  } else {
    entries.forEach(([s,g])=>{
      const eMed = estimateMedian(g.eBins, D.espera_bins)
      const dMed = estimateMedian(g.dBins, D.dur_bins)
      html += `<tr><td><div class="sede-name">${s}</div></td><td>${fmtMin(eMed)}</td><td>${fmtMin(dMed)}</td><td style="color:var(--gray)">${g.n.toLocaleString()}</td></tr>`
    })
  }
  html += `<tr><td><div class="sede-name">Marcadas "Desde Guardia" (todas las especialidades)</div><div class="click-hint">solo conteo — no separamos espera/duración para este flag</div></td><td colspan="2" style="color:var(--gray)">—</td><td style="color:var(--gray)">${nGuardiaFlag.toLocaleString()} de ${nTotal.toLocaleString()} (${nTotal?(nGuardiaFlag/nTotal*100).toFixed(1):'0'}%)</td></tr>`
  return html
}

function renderPorProfesional(D) {
  const profRows = D.prof_rows || []
  if (!profRows.length) {
    return '<div class="empty">No hay datos de profesional cargados (subí de nuevo el Excel de Atenciones para habilitar este detalle).</div>'
  }
  const centroIdx = demorasState.centro==='todos' ? null : D.centros.indexOf(demorasState.centro)
  const servicioIdx = demorasState.servicio==='todos' ? null : D.servicios.indexOf(demorasState.servicio)
  const labIdx = D.servicios.indexOf('LABORATORIO INTERNO')
  const limitado = (centroIdx===null && servicioIdx===null)
  const agg = {}
  profRows.forEach(row=>{
    const [c,s,personal,n,eN,eSum,dN,dSum,eMax,tN,tSum] = row
    if (centroIdx!==null && c!==centroIdx) return
    if (servicioIdx!==null && s!==servicioIdx) return
    if (limitado && s===labIdx) return // sin filtro: Laboratorio distorsiona el ranking, se excluye (podés filtrarlo explícitamente arriba si lo querés ver)
    if (!agg[personal]) agg[personal] = {n:0,eN:0,eSum:0,eMax:null,dN:0,dSum:0,tN:0,tSum:0}
    const a = agg[personal]
    a.n+=n; a.eN+=eN; a.eSum+=eSum; a.dN+=(dN||0); a.dSum+=(dSum||0); a.tN+=(tN||0); a.tSum+=(tSum||0)
    if (eMax!==undefined && eMax!==null && (a.eMax===null || eMax>a.eMax)) a.eMax = eMax
  })
  let list = Object.entries(agg).map(([personal,g])=>({
    personal, n:g.n,
    eAvg: g.eN? g.eSum/g.eN : null,
    eMax: g.eMax,
    dAvg: g.dN? g.dSum/g.dN : null,
    tAvg: g.tN? g.tSum/g.tN : null,
  }))
  const dir = demorasUI.profSortDir === 'asc' ? 1 : -1
  list.sort((a,b)=> dir * ((a.eAvg||0)-(b.eAvg||0)))
  if (limitado) list = list.slice(0,15)
  if (!list.length) return '<div class="empty">Sin datos de profesional para este filtro.</div>'
  return `
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px">
      <span class="filter-label">Ordenar espera:</span>
      <button class="filter-btn ${demorasUI.profSortDir==='desc'?'active':''}" onclick="setProfSortDir('desc')">Mayor primero</button>
      <button class="filter-btn ${demorasUI.profSortDir==='asc'?'active':''}" onclick="setProfSortDir('asc')">Menor primero</button>
    </div>
    <table class="data-table" style="margin:0 -1.25rem;width:calc(100% + 2.5rem)">
    <thead><tr><th>Profesional</th><th>Espera promedio</th><th>Espera máxima</th><th>Duración promedio</th><th>Tiempo total en sanatorio</th><th>Atenciones</th></tr></thead>
    <tbody>${list.map(p=>`<tr><td>${p.personal}</td><td>${fmtMin(p.eAvg)}</td><td>${fmtMin(p.eMax)}</td><td>${fmtMin(p.dAvg)}</td><td>${fmtMin(p.tAvg)}</td><td style="color:var(--gray)">${p.n.toLocaleString()}</td></tr>`).join('')}</tbody>
  </table>${limitado ? '<div style="font-size:11px;color:var(--gray);padding:8px 0 0">Mostrando los 15 de mayor volumen en toda la red (sin Laboratorio, para no repetir lo ya separado arriba) — elegí un Centro o Servicio para ver el detalle completo de ese recorte, incluyendo Laboratorio si corresponde.</div>' : ''}`
}

function renderTopServiciosVolumen(rows, D) {
  const groups = {}
  rows.forEach(r=>{
    const s = r[D_IDX.servicio]
    if (!groups[s]) groups[s] = 0
    groups[s] += r[D_IDX.n]
  })
  const list = Object.entries(groups).map(([s,n])=>({servicio:D.servicios[s], n})).sort((a,b)=>b.n-a.n).slice(0,10)
  if (!list.length) return '<div class="empty">Sin datos.</div>'
  const maxVal = list[0].n
  return '<div class="rank-list">' + list.map((g,i)=>{
    const pct = Math.max(6, Math.round((g.n/maxVal)*100))
    return `<div class="rank-row">
      <div class="rank-pos">#${i+1}</div>
      <div class="rank-name">${g.servicio}</div>
      <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:${pct}%;background:var(--teal)"></div></div>
      <div class="rank-val">${g.n.toLocaleString()}</div>
    </div>`
  }).join('') + '</div>'
}

function renderDemorasRanking(rows, D) {
  const key = (r)=> r[D_IDX.centro]+'|'+r[D_IDX.servicio]
  const groups = {}
  rows.forEach(r=>{
    const k = key(r)
    if (!groups[k]) groups[k] = { centro:r[D_IDX.centro], servicio:r[D_IDX.servicio], n:0, eN:0, eSum:0 }
    groups[k].n += r[D_IDX.n]; groups[k].eN += r[D_IDX.eN]; groups[k].eSum += r[D_IDX.eSum]
  })
  let list = Object.values(groups).filter(g=>g.n>=20).map(g=>({...g, eAvg: g.eN ? g.eSum/g.eN : null}))
  list = list.filter(g=>g.eAvg!==null).sort((a,b)=>b.eAvg-a.eAvg).slice(0,10)
  if (!list.length) return '<div class="empty">No hay suficientes datos para este filtro (mínimo 20 atenciones por combinación).</div>'
  const maxVal = list[0].eAvg
  return '<div class="rank-list">' + list.map((g,i)=>{
    const pct = Math.max(6, Math.round((g.eAvg/maxVal)*100))
    const color = g.eAvg>60?'var(--danger)':g.eAvg>30?'var(--warning)':'var(--teal)'
    return `<div class="rank-row">
      <div class="rank-pos">#${i+1}</div>
      <div class="rank-name">${centroLabelD(D.centros[g.centro])} · ${D.servicios[g.servicio]}</div>
      <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="rank-val" style="color:${color}">${fmtMin(g.eAvg)}</div>
    </div>`
  }).join('') + '</div>'
}

function renderDemorasCentroRows(rows, D) {
  const groups = {}
  rows.forEach(r=>{
    const c = r[D_IDX.centro]
    if (!groups[c]) groups[c] = { n:0, eBins:[0,0,0,0,0,0], dBins:[0,0,0,0,0,0] }
    groups[c].n += r[D_IDX.n]
    for(let i=0;i<6;i++){ groups[c].eBins[i]+=r[D_IDX.eB+i]; groups[c].dBins[i]+=r[D_IDX.dB+i] }
  })
  let entries = Object.entries(groups).map(([c,g])=>({
    centro: D.centros[c], n:g.n,
    eMed: estimateMedian(g.eBins, D.espera_bins),
    dMed: estimateMedian(g.dBins, D.dur_bins)
  }))
  if (demorasState.sortCol) {
    entries.sort((a,b)=>{
      let va,vb
      if (demorasState.sortCol==='centro') { va=centroLabelD(a.centro); vb=centroLabelD(b.centro) }
      else if (demorasState.sortCol==='n') { va=a.n; vb=b.n }
      else if (demorasState.sortCol==='espera') { va=a.eMed||0; vb=b.eMed||0 }
      else { va=a.dMed||0; vb=b.dMed||0 }
      return demorasState.sortDir==='asc' ? (va>vb?1:-1) : (va<vb?1:-1)
    })
  } else {
    entries.sort((a,b)=>(b.eMed||0)-(a.eMed||0))
  }
  if (!entries.length) return '<tr><td colspan="5" class="empty">Sin datos para este filtro.</td></tr>'
  return entries.map(e=>`<tr>
    <td><div class="sede-name">${centroLabelD(e.centro)}</div></td>
    <td>${fmtMin(e.eMed)}</td>
    <td>${fmtMin(e.dMed)}</td>
    <td style="color:var(--gray)">${e.n.toLocaleString()}</td>
    <td>${demorasBadge(e.eMed,'espera')}</td>
  </tr>`).join('')
}

function renderDemorasTrendChart(rows, D) {
  const byFecha = {}
  rows.forEach(r=>{
    const f = r[D_IDX.fecha]
    if (!byFecha[f]) byFecha[f] = {eN:0,eSum:0,dN:0,dSum:0}
    byFecha[f].eN += r[D_IDX.eN]; byFecha[f].eSum += r[D_IDX.eSum]
    byFecha[f].dN += r[D_IDX.dN]; byFecha[f].dSum += r[D_IDX.dSum]
  })
  const idxs = Object.keys(byFecha).map(Number).sort((a,b)=>a-b)
  const labels = idxs.map(i=>D.fechas[i])
  const espVals = idxs.map(i=>byFecha[i].eN ? +(byFecha[i].eSum/byFecha[i].eN).toFixed(1) : null)
  const durVals = idxs.map(i=>byFecha[i].dN ? +(byFecha[i].dSum/byFecha[i].dN).toFixed(1) : null)
  if (charts.demorasTrend) charts.demorasTrend.destroy()
  const ctx = document.getElementById('chart-demoras-trend')
  if (!ctx) return
  charts.demorasTrend = new Chart(ctx,{
    type:'line',

function reclamosFilteredRecords() {
  const R = reclamosActiveData()
  let cutoff = null
  if (reclamosState.periodo !== 'todo') {

    const lastDate = parseLocalDate(R.meta.fecha_max)

  }

const ESTADOS_RESUELTOS = ['Resuelto','Cerrado']
const ESTADOS_ABIERTOS = ['Abierto','En análisis','Pendiente contacto paciente','Pendiente respuesta interna']
const SLA_CIERRE_DIAS_HABILES = 7 // instructivo Gestión de Reclamos v2.0, sección 6.8 — aplica a todas las prioridades
function businessDaysBetween(isoA, isoB) {
  if (!isoA || !isoB) return null
  const a = parseLocalDate(isoA), b = parseLocalDate(isoB)
  if (isNaN(a) || isNaN(b) || b < a) return 0
  let days = 0
  const cur = new Date(a)
  while (cur < b) {
    cur.setDate(cur.getDate()+1)
    const dow = cur.getDay()
    if (dow !== 0 && dow !== 6) days++
  }
  return days
}
function computeSlaCierre(r, hoyISO) {
  if (r.estado === 'Cancelado') return 'na'
  if (ESTADOS_RESUELTOS.includes(r.estado)) {
    const cierreISO = r.r || r.u // Resuelta real si existe, si no Actualizada como aproximación
    if (!cierreISO) return 'sin_dato'
    const dias = businessDaysBetween(r.c, cierreISO)
    return dias <= SLA_CIERRE_DIAS_HABILES ? 'cumple' : 'incumple'
  }
  return businessDaysBetween(r.c, hoyISO) > SLA_CIERRE_DIAS_HABILES ? 'vencido_abierto' : 'en_plazo_abierto'
}

const MESES_JIRA = {ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12}
function parseJiraDateStr(s) {
  if (!s) return null
  const m = String(s).trim().match(/^(\d{1,2})\/([a-zA-Z]{3})\/(\d{2})\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i)
  if (!m) return null
  let [, d, mon, y, h, mi, ap] = m
  mon = MESES_JIRA[mon.toLowerCase()]
  if (!mon) return null
  y = 2000+parseInt(y); h = parseInt(h)%12; if (ap.toUpperCase()==='PM') h += 12
  const dt = new Date(y, mon-1, parseInt(d), h, parseInt(mi))
  return dt
}
function toISODate(dt) {
  if (!dt || isNaN(dt)) return null
  const pad = n=>String(n).padStart(2,'0')
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`
}
